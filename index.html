/* ==== Lưu trữ dữ liệu bằng Supabase, TÁCH NHIỀU BẢNG (bản chạy độc lập, không phụ thuộc Claude) ====

const _iso = (ms) => { if (ms == null || ms === "") return null; const d = new Date(Number(ms)); return isNaN(d.getTime()) ? null : d.toISOString(); };

/* ---- Đăng nhập Supabase Auth: gọi thẳng REST của GoTrue, không cần thư viện ngoài ---- */
const C3H_AUTH = (() => {
  const KEY = "c3h-sb-session";
  let session = null;
  let refreshing = null;
  const api = { onLost: null };
  const nowSec = () => Math.floor(Date.now() / 1000);
  try { session = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { session = null; }
  if (session && !(session.refresh_token && session.user && session.user.id)) session = null;
  const store = (s) => {
    session = s;
    try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (e) {}
  };
  const keep = (j) => ({
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: j.expires_at || nowSec() + (j.expires_in || 3600),
    user: { id: j.user && j.user.id, email: j.user && j.user.email },
  });
  const authFetch = (path, opts) => fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    ...opts,
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json", ...((opts && opts.headers) || {}) },
  });
  const emailOf = (input) => {
    const v = String(input || "").trim().toLowerCase();
    return v.includes("@") ? v : `${v}@${AUTH_EMAIL_DOMAIN}`;
  };
  const msgOf = async (res, fallback) => {
    let j = null;
    try { j = await res.json(); } catch (e) {}
    return (j && (j.msg || j.error_description || j.message || j.error)) || fallback;
  };

  api.signIn = async (usernameOrEmail, password) => {
    const res = await authFetch("token?grant_type=password", { method: "POST", body: JSON.stringify({ email: emailOf(usernameOrEmail), password }) });
    if (!res.ok) {
      if (res.status === 400 || res.status === 401 || res.status === 422) throw new Error("Sai tên đăng nhập hoặc mật khẩu");
      throw new Error(await msgOf(res, "Không đăng nhập được (lỗi " + res.status + ")"));
    }
    const s = keep(await res.json());
    store(s);
    return s;
  };
  // Làm mới phiên bằng refresh token. Chỉ xoá phiên khi máy chủ từ chối (bị thu hồi/khoá), còn mất mạng thì giữ nguyên.
  const doRefresh = () => {
    if (refreshing) return refreshing;
    refreshing = (async () => {
      const res = await authFetch("token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: session.refresh_token }) });
      if (!res.ok) {
        if (res.status === 400 || res.status === 401 || res.status === 403) { store(null); return null; }
        throw new Error("Máy chủ đăng nhập trả lỗi " + res.status);
      }
      const s = keep(await res.json());
      store(s);
      return s;
    })().finally(() => { refreshing = null; });
    return refreshing;
  };
  api.restore = async () => {
    if (!session) return null;
    if (session.expires_at - 60 > nowSec()) return session;
    return await doRefresh();
  };
  api.getToken = async () => {
    if (!session) return null;
    if (session.expires_at - 60 <= nowSec()) {
      const s = await doRefresh();
      if (!s) { if (api.onLost) api.onLost(); return null; }
    }
    return session ? session.access_token : null;
  };
  api.forceRefresh = async () => {
    if (!session) return null;
    const s = await doRefresh();
    if (!s && api.onLost) api.onLost();
    return s;
  };
  api.lost = () => { store(null); if (api.onLost) api.onLost(); };
  api.signOut = async () => {
    const tok = session && session.access_token;
    store(null);
    if (tok) {
      try { await authFetch("logout?scope=local", { method: "POST", headers: { Authorization: `Bearer ${tok}` } }); } catch (e) {}
    }
  };
  api.changePassword = async (newPassword) => {
    const tok = await api.getToken();
    if (!tok) throw new Error("Phiên đăng nhập đã hết hạn");
    const res = await authFetch("user", { method: "PUT", headers: { Authorization: `Bearer ${tok}` }, body: JSON.stringify({ password: newPassword }) });
    if (!res.ok) throw new Error(await msgOf(res, "Không đổi được mật khẩu"));
  };
  // Gọi hàm c3h-admin (Edge Function) để tạo / đổi mật khẩu / khoá / xoá tài khoản đăng nhập của nhân viên
  api.adminCall = async (body) => {
    const tok = await api.getToken();
    if (!tok) throw new Error("Phiên đăng nhập đã hết hạn");
    let res;
    try {
      res = await fetch(`${SUPABASE_URL}/functions/v1/c3h-admin`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw new Error("Không gọi được hàm c3h-admin (mất mạng, hoặc chưa triển khai hàm này trên Supabase)");
    }
    let j = null;
    try { j = await res.json(); } catch (e) {}
    if (res.status === 404) throw new Error("Chưa triển khai hàm c3h-admin trên Supabase (xem hướng dẫn)");
    if (!res.ok) throw new Error((j && (j.error || j.message)) || "Hàm c3h-admin lỗi " + res.status);
    return j;
  };
  // Đọc ảnh bill POS365 bằng AI (Edge Function c3h-bill-ocr). Trả về object "bill" có cấu trúc.
  api.ocrBill = async (imageB64, mediaType, services) => {
    const tok = await api.getToken();
    if (!tok) throw new Error("Phiên đăng nhập đã hết hạn");
    let res;
    try {
      res = await fetch(`${SUPABASE_URL}/functions/v1/c3h-bill-ocr`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageB64, mediaType: mediaType || "image/jpeg", services }),
      });
    } catch (e) {
      throw new Error("Không gọi được hàm c3h-bill-ocr (mất mạng, hoặc chưa triển khai hàm này trên Supabase)");
    }
    let j = null;
    try { j = await res.json(); } catch (e) {}
    if (res.status === 404) throw new Error("Chưa triển khai hàm c3h-bill-ocr trên Supabase (xem hướng dẫn)");
    if (!res.ok) throw new Error((j && (j.error || j.message)) || "Hàm c3h-bill-ocr lỗi " + res.status);
    if (!j || !j.bill) throw new Error("Không đọc được bill, hãy chụp lại rõ hơn");
    return j.bill;
  };
  return api;
})();

// Mọi lệnh đọc/ghi dữ liệu đều đi qua đây: gắn token đăng nhập, tự gia hạn khi hết hạn
async function sbFetch(path, opts) {
  const run = async (tok) => fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...(opts || {}),
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${tok || SUPABASE_ANON_KEY}`, ...((opts && opts.headers) || {}) },
  });
  let res = await run(await C3H_AUTH.getToken());
  if (res.status === 401) {
    const s = await C3H_AUTH.forceRefresh();
    if (s) res = await run(s.access_token);
    if (res.status === 401) { C3H_AUTH.lost(); throw new Error("Phiên đăng nhập đã hết hạn, hãy đăng nhập lại"); }
  }
  return res;
}
async function sbCheck(res, what) {
  if (res.ok) return;
  let detail = "";
  try { detail = await res.text(); } catch (e) {}
  if (res.status === 404 || /PGRST20[0-9]|does not exist/i.test(detail)) throw new Error(MISSING_TABLE_HINT + " (" + what + ")");
  if (res.status === 403 || /row-level security|permission denied|42501/i.test(detail)) {
    const e = new Error("Không có quyền " + what);
    e.permission = true; // máy chủ từ chối theo vai trò — thử lại cũng vậy
    throw e;
  }
  throw new Error("Supabase " + what + " lỗi " + res.status + (detail ? ": " + detail.slice(0, 120) : ""));
}
// Đọc hết 1 bảng, mỗi lượt 1000 dòng (giới hạn của Supabase)
async function sbGetAll(table, orderCol) {
  const out = [];
  for (let offset = 0; ; offset += 1000) {
    const res = await sbFetch(`${table}?select=*&order=${orderCol}.asc&limit=1000&offset=${offset}`);
    await sbCheck(res, "đọc " + table);
    const rows = await res.json();
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
async function sbUpsert(table, rows, pk) {
  for (let i = 0; i < rows.length; i += 400) {
    const res = await sbFetch(`${table}?on_conflict=${pk}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows.slice(i, i + 400)),
    });
    await sbCheck(res, "ghi " + table);
  }
}
// Ghi nhiều dòng; nếu máy chủ từ chối quyền thì ghi từng dòng để các dòng hợp lệ vẫn được lưu,
// dòng bị từ chối thì bỏ qua (không thử lại mãi làm kẹt các lần lưu sau).
async function sbUpsertTolerant(table, rows, pk, rejected) {
  try {
    await sbUpsert(table, rows, pk);
  } catch (e) {
    if (!e || !e.permission) throw e;
    for (const r of rows) {
      try { await sbUpsert(table, [r], pk); }
      catch (e2) { if (!e2 || !e2.permission) throw e2; rejected.push(table); }
    }
  }
}
async function sbDelete(table, ids, textId) {
  for (let i = 0; i < ids.length; i += 100) {
    const part = ids.slice(i, i + 100).map((x) => (textId ? '"' + String(x).replace(/"/g, '\\"') + '"' : Number(x)));
    const res = await sbFetch(`${table}?id=in.(${encodeURIComponent(part.join(","))})`, {
      method: "DELETE",
      headers: { Prefer: "return=minimal" },
    });
    await sbCheck(res, "xoá " + table);
  }
}
// Bảng cũ (1 dòng JSON) — chỉ dùng để chuyển dữ liệu sang bảng mới 1 lần (cần quyền Quản lý/Admin để đọc)
async function sbLegacyGet() {
  try {
    const res = await sbFetch(`c3h_data?id=eq.${encodeURIComponent(DB_DOC_PATH)}&select=data`);
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.length ? rows[0].data : null;
  } catch (e) {
    return null;
  }
}

// ---- Bóng (shadow): bản ghi lần đồng bộ thành công gần nhất, để chỉ ghi các dòng thay đổi ----
let dbShadow = null;
let dbQueue = Promise.resolve();
const dbEmptyShadow = () => ({ rows: {}, settings: {} });
function dbRowOf(c, o, i) {
  const row = { id: o.id, ...c.cols(o), data: o };
  if (c.pos) row.pos = i;
  return row;
}
function dbSettingsOf(state) {
  const counters = {}; DB_COUNTER_KEYS.forEach((k) => { if (state[k] != null) counters[k] = state[k]; });
  const flags = {}; DB_FLAG_KEYS.forEach((k) => { flags[k] = !!state[k]; });
  return { counters, flags };
}
function dbShadowOf(state) {
  const sh = dbEmptyShadow();
  DB_COLLECTIONS.forEach((c) => {
    const m = new Map();
    (state[c.key] || []).forEach((o, i) => { if (o && o.id != null) m.set(String(o.id), JSON.stringify(dbRowOf(c, o, i))); });
    sh.rows[c.key] = m;
  });
  const s = dbSettingsOf(state);
  sh.settings = { counters: JSON.stringify(s.counters), flags: JSON.stringify(s.flags) };
  return sh;
}

// Trả về { exists, data, fromLegacy } — data có dạng giống hệt state cũ nên phần còn lại của app không đổi
async function dbLoadAll() {
  const settingRows = await sbGetAll("c3h_settings", "key");
  const countersRow = settingRows.find((r) => r.key === "counters");
  if (!countersRow) {
    // Chưa có dữ liệu ở bảng mới: thử chuyển từ bảng cũ
    const legacy = await sbLegacyGet();
    dbShadow = dbEmptyShadow(); // shadow rỗng => lần lưu tiếp theo ghi toàn bộ vào các bảng mới
    return legacy ? { exists: true, fromLegacy: true, data: legacy } : { exists: false, data: null };
  }
  const flagsRow = settingRows.find((r) => r.key === "flags");
  const data = { ...(countersRow.value || {}), ...((flagsRow && flagsRow.value) || {}) };
  for (const c of DB_COLLECTIONS) {
    const rows = await sbGetAll(c.table, c.pos ? "pos" : "id");
    const list = rows.map((r) => r.data);
    if (c.sort) list.sort(c.sort);
    data[c.key] = list;
  }
  // Bộ đếm không bao giờ được thấp hơn id lớn nhất đang có (phòng trường hợp ghi dở)
  const nextOf = { orders: "nextId", expenses: "nextExpId", meterLogs: "nextMeterId", cashLogs: "nextCashId", customers: "nextCustomerId", users: "nextUserId", actionLogs: "nextLogId", shifts: "nextShiftId" };
  Object.keys(nextOf).forEach((k) => {
    const maxId = (data[k] || []).reduce((m, o) => Math.max(m, Number(o.id) || 0), 0);
    data[nextOf[k]] = Math.max(Number(data[nextOf[k]]) || 1, maxId + 1);
  });
  dbShadow = dbShadowOf(data);
  return { exists: true, data };
}

async function dbSaveNow(next) {
  const shadow = dbShadow || dbEmptyShadow();
  const newShadow = dbEmptyShadow();
  const stamp = new Date().toISOString();
  const work = [];
  const rejected = [];
  for (const c of DB_COLLECTIONS) {
    const prev = shadow.rows[c.key] || new Map();
    const cur = new Map();
    const upserts = [];
    (next[c.key] || []).forEach((o, i) => {
      if (!o || o.id == null) return;
      const row = dbRowOf(c, o, i);
      const sig = JSON.stringify(row);
      cur.set(String(o.id), sig);
      if (prev.get(String(o.id)) !== sig) upserts.push({ ...row, updated_at: stamp });
    });
    const dels = [...prev.keys()].filter((k) => !cur.has(k));
    newShadow.rows[c.key] = cur;
    if (upserts.length) work.push(() => sbUpsertTolerant(c.table, upserts, "id", rejected));
    if (dels.length) work.push(() => sbDelete(c.table, dels, !!c.textId));
  }
  const s = dbSettingsOf(next);
  const sigC = JSON.stringify(s.counters), sigF = JSON.stringify(s.flags);
  newShadow.settings = { counters: sigC, flags: sigF };
  // Ghi bảng dữ liệu trước, ghi bộ đếm/cờ SAU CÙNG: nếu đứt giữa chừng thì lần mở sau vẫn coi là "chưa chuyển xong" và làm lại an toàn
  for (const w of work) await w();
  const setRows = [];
  if (shadow.settings.counters !== sigC) setRows.push({ key: "counters", value: s.counters, updated_at: stamp });
  if (shadow.settings.flags !== sigF) setRows.push({ key: "flags", value: s.flags, updated_at: stamp });
  if (setRows.length) await sbUpsertTolerant("c3h_settings", setRows, "key", rejected);
  dbShadow = newShadow;
  if (rejected.length) {
    const names = { c3h_orders: "đơn hàng", c3h_customers: "khách hàng", c3h_expenses: "chi tiền", c3h_users: "nhân viên", c3h_action_logs: "nhật ký", c3h_shifts: "ca làm", c3h_meter_logs: "chỉ số", c3h_cash_logs: "két", c3h_services: "bảng giá", c3h_expense_categories: "danh mục chi", c3h_settings: "cài đặt" };

// Băm mật khẩu bằng SHA-256, trả về chuỗi hex
async function hashPassword(plain) {
  const enc = new TextEncoder().encode(plain);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

// Cho phép nhập số lượng/kg theo kiểu Việt Nam (dấu phẩy thập phân, VD "5,6")
// lẫn kiểu quốc tế (dấu chấm, VD "5.6") — chuẩn hoá về số trước khi parse.
function parseQty(v) {
  if (v == null || v === "") return 0;
  const n = parseFloat(String(v).trim().replace(",", "."));
  return isNaN(n) ? 0 : n;
}

// Công thức chung: nếu có ngưỡng tối thiểu (minQty>0) và số lượng dưới ngưỡng
// thì tính giá tối thiểu (minPrice); ngược lại tính theo đơn giá x số lượng.
function calcPrice(services, serviceId, qty) {
  const svc = services.find((s) => s.id === serviceId);
  if (!svc) return 0;
  const q = parseQty(qty);
  if (q <= 0) return 0;
  if (svc.minQty > 0 && q < svc.minQty) return svc.minPrice || 0;
  return Math.round(q * (svc.unitPrice || 0));
}

function slugify(text, existingIds) {
  const base = normalizeStr(text).replace(/[^a-z0-9]+/g, "").slice(0, 20) || "muc";
  let id = base, i = 2;
  while (existingIds.includes(id)) { id = base + i; i++; }
  return id;
}

function applyOneTimeImport(data) {
  let services = data.services;
  let customers = data.customers;
  let nextCustomerId = data.nextCustomerId;

  const existingSvcKeys = new Set(services.map((s) => (s.label + "|" + s.unit).toLowerCase()));

    services = [...services, { id, label: s.label, unit: s.unit, minQty: s.minQty, minPrice: s.minPrice, unitPrice: s.unitPrice }];

  });

  const existingCustKeys = new Set(customers.map((c) => c.phone || c.name.toLowerCase()));
  SEED_CUSTOMERS_V1.forEach((c) => {

    nextCustomerId += 1;
    existingCustKeys.add(key);
  });

  return { ...data, services, customers, nextCustomerId };

const TAX_RATE = 0.08;

function fmtMoney(n) {
  return (n || 0).toLocaleString("vi-VN") + "đ";
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" }) +
    " " + d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
}
function sameDay(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
}
// Chuỗi ngày dạng YYYY-MM-DD theo giờ địa phương (dùng cho <input type="date"> và so khớp createdAt)
function dateStr(ts) {
  const d = new Date(ts);
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}
function todayStr() {
  return dateStr(Date.now());
}

// Sinh mã đơn hàng dạng YYMMDD_XX — XX là số thứ tự đơn trong CÙNG NGÀY tạo,
// tự reset về 01 mỗi ngày mới (đếm dựa trên các đơn đã có cùng ngày trong `orders`).
function genOrderCode(orders, ts) {
  const d = new Date(ts);
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const prefix = yy + mm + dd;
  const countSameDay = orders.filter((o) => sameDay(o.createdAt, ts)).length;
  const seq = String(countSameDay + 1).padStart(2, "0");
  return prefix + "_" + seq;
}

// Từ chỉ số lũy kế (công tơ điện/nước), tính ra lượng tiêu thụ giữa 2 lần ghi gần nhau
function computeMeterUsage(logs) {
  const asc = [...logs].sort((a, b) => a.createdAt - b.createdAt);
  let prevDien = null, prevNuoc = null;
  const withUsage = asc.map((l) => {
    let dienUsed = null, nuocUsed = null;
    if (l.dienReading != null) {
      if (prevDien != null) dienUsed = Math.round((l.dienReading - prevDien) * 100) / 100;
      prevDien = l.dienReading;
    }
    if (l.nuocReading != null) {
      if (prevNuoc != null) nuocUsed = Math.round((l.nuocReading - prevNuoc) * 100) / 100;
      prevNuoc = l.nuocReading;
    }
    return { ...l, dienUsed, nuocUsed };
  });
  return withUsage.reverse(); // mới nhất trước
}

/* ---- Helpers cho Import Excel ---- */
function normalizeStr(s) {
  return String(s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d");
}
function matchService(services, text) {
  const n = normalizeStr(text);
  if (!n) return null;
  // So khớp theo nhãn dịch vụ hiện có (kể cả dịch vụ tự thêm)
  for (const s of services) {
    const ln = normalizeStr(s.label);
    if (ln && (n.includes(ln) || ln.includes(n))) return s.id;
  }
  // So khớp theo từ khóa gợi ý cho các dịch vụ mặc định
  if (n.includes("tay") && (n.includes("quan") || n.includes("ao"))) {
    const s = services.find((s2) => s2.id === "tayquanao"); if (s) return s.id;
  }
  if (n.includes("gau") && n.includes("bong")) { const s = services.find((s2) => s2.id === "gaubong"); if (s) return s.id; }
  if (n.includes("giuong")) { const s = services.find((s2) => s2.id === "gagiuong"); if (s) return s.id; }
  if (n.includes("chan") || n.includes("men") || n.includes("topper")) { const s = services.find((s2) => s2.id === "chanmen"); if (s) return s.id; }
  if (n.includes("balo")) { const s = services.find((s2) => s2.id === "balo"); if (s) return s.id; }
  if (n.includes("quan ao") || n.includes("quanao") || n.includes("ao")) { const s = services.find((s2) => s2.id === "quanao"); if (s) return s.id; }
  return null;
}
function matchStatus(text) {
  const n = normalizeStr(text);
  if (n.includes("hoan thanh") || n.includes("thanh toan")) return "hoanthanh";
  if (n.includes("da giao")) return "dagiao";
  if (n.includes("cho giao")) return "chogiao";
  if (n.includes("xu ly") || n.includes("xong")) return "dangxuly";
  if (n.includes("tiep nhan")) return "tiepnhan";
  return null;
}
function parseExcelValue(v) {
  if (v == null) return "";
  return String(v).trim();
}
function parseExcelQty(v) {
  if (v == null) return 0;
  const n = parseFloat(String(v).replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function parseExcelPrice(v) {
  if (v == null || v === "") return null;
  const digits = String(v).replace(/[^\d]/g, "");
  return digits ? parseInt(digits, 10) : null;
}
function parseExcelDate(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") {
    try {
      const d = XLSX.SSF.parse_date_code(v);
      if (d) return new Date(d.y, d.m - 1, d.d, d.H || 0, d.M || 0, d.S || 0).getTime();
    } catch (e) {}
  }
  const t = new Date(v).getTime();
  return isNaN(t) ? null : t;
}

/* ---- Ca làm việc / kết ca: tính tiền mặt dự kiến trong két ----
   Tiền mặt dự kiến = tiền đầu ca + tiền mặt thu được từ đơn hàng đã thanh toán tiền mặt
   trong khoảng thời gian ca (không trừ chi phí — app hiện chưa phân biệt khoản chi nào
   lấy tiền từ két tiền mặt hay từ nguồn khác, nên không đưa vào công thức đối chiếu két). */
function cashRevenueInRange(orders, fromTs, toTs) {
  return orders
    .filter((o) => o.status === "hoanthanh" && o.paymentMethod === "tienmat" && o.paidAt >= fromTs && o.paidAt <= toTs)
    .reduce((s, o) => s + (o.total || 0), 0);
}
function computeExpectedCash(shift, orders, expenses, atTs) {
  const rev = cashRevenueInRange(orders, shift.openedAt, atTs);
  return (shift.openingCash || 0) + rev;
}

      const tok = Date.now();
      setUndoInfo({
        tok, orderId, code: ord.code, name: ord.customerName, toLabel: statusLabel,
        status: ord.status, paidAt: ord.paidAt || null, paymentMethod: ord.paymentMethod || null,
      });
      setTimeout(() => setUndoInfo((cur) => (cur && cur.tok === tok ? null : cur)), 5000);
    }
  };

  const undoStatus = () => {
    if (!undoInfo) return;
    const u = undoInfo;
    const backLabel = (STATUSES.find((s) => s.id === u.status) || {}).label || u.status;
    persist(withLog(
      {
        ...data,
        orders: data.orders.map((o) =>
          o.id === u.orderId ? { ...o, status: u.status, paidAt: u.paidAt, paymentMethod: u.paymentMethod } : o
        ),
      },
      "order.setStatus",
      `Hoàn tác đơn ${u.code} → ${backLabel}`
    ));
    setUndoInfo(null);
  };

  const advance = (order) => {
    const i = statusIndex(order.status);
    if (i >= STATUSES.length - 1) return;
    const nextId = STATUSES[i + 1].id;
    if (nextId === "hoanthanh") {
      setAskPaymentOrder(order); // cần hỏi phương thức thanh toán trước khi chuyển "Hoàn thành"
    } else {
      setStatus(order.id, nextId);
    }
  };

  // Lùi 1 bước (bấm nhầm, hoặc khách chưa lấy đồ)
  const retreat = (order) => {
    const i = statusIndex(order.status);
    if (i <= 0) return;
    setStatus(order.id, STATUSES[i - 1].id);
  };

  // Nhảy thẳng tới 1 trạng thái bất kỳ (bấm vào nhãn trạng thái trên thẻ)
  const jumpTo = (order, statusId) => {
    if (statusId === order.status) return;
    if (statusId === "hoanthanh") {
      setAskPaymentOrder(order);
    } else {
      setStatus(order.id, statusId);
    }
  };

  const confirmAdvancePayment = (method) => {
    if (!askPaymentOrder) return;
    setStatus(askPaymentOrder.id, "hoanthanh", method);
    setAskPaymentOrder(null);
  };

  const setOrderPriority = (orderId, level) => {
    const ord = data.orders.find((o) => o.id === orderId);
    if (!ord || (ord.priority || "thuong") === level) return;
    persist(withLog(
      { ...data, orders: data.orders.map((o) => (o.id === orderId ? { ...o, priority: level } : o)) },
      "order.priority",
      `Đơn ${ord.code} → mức ${priorityOf({ priority: level }).label}`
    ));
  };

  const deleteOrder = (orderId) => {
    const ord = data.orders.find((o) => o.id === orderId);
    persist(withLog(
      { ...data, orders: data.orders.filter((o) => o.id !== orderId) },
      "order.delete",
      `Xoá đơn ${ord ? ord.code : orderId}`
    ));
    setDetail(null);
    showToast("🗑 Đã xoá đơn");
  };

  const addExpense = (exp) => {
    const newExp = { ...exp, id: data.nextExpId, createdAt: exp.date || Date.now() };
    const merged = [newExp, ...data.expenses].sort((a, b) => b.createdAt - a.createdAt);
    const catLabel = expenseCatOf(data.expenseCategories, newExp.category).label;
    persist(withLog(
      { ...data, expenses: merged, nextExpId: data.nextExpId + 1 },
      "expense.create",
      `Thêm khoản chi ${fmtMoney(newExp.amount)} · ${catLabel}`
    ));
    setShowNewExpense(false);
    showToast("✅ Đã ghi nhận khoản chi");
  };

  const deleteExpense = (expId) => {
    const exp = data.expenses.find((e) => e.id === expId);
    const desc = exp ? `Xoá khoản chi ${fmtMoney(exp.amount)} · ${expenseCatOf(data.expenseCategories, exp.category).label}` : "Xoá khoản chi";
    persist(withLog(
      { ...data, expenses: data.expenses.filter((e) => e.id !== expId) },
      "expense.delete",
      desc
    ));
    showToast("🗑 Đã xoá khoản chi");
  };

  // ---- quản lý danh mục: dịch vụ & loại chi phí ----
  const saveService = (svc, isNew) => {
    const services = isNew
      ? [...data.services, { ...svc, id: slugify(svc.label, data.services.map((s) => s.id)) }]
      : data.services.map((s) => (s.id === svc.id ? svc : s));
    persist({ ...data, services });
    showToast(isNew ? "✅ Đã thêm dịch vụ" : "✅ Đã cập nhật dịch vụ");
  };

  const deleteService = (id) => {
    persist({ ...data, services: data.services.filter((s) => s.id !== id) });
    showToast("🗑 Đã xoá dịch vụ");
  };

  const saveExpenseCategory = (cat, isNew) => {
    const expenseCategories = isNew
      ? [...data.expenseCategories, { ...cat, id: slugify(cat.label, data.expenseCategories.map((c) => c.id)) }]
      : data.expenseCategories.map((c) => (c.id === cat.id ? cat : c));
    persist({ ...data, expenseCategories });
    showToast(isNew ? "✅ Đã thêm danh mục" : "✅ Đã cập nhật danh mục");
  };

  const deleteExpenseCategory = (id) => {
    persist({ ...data, expenseCategories: data.expenseCategories.filter((c) => c.id !== id) });
    showToast("🗑 Đã xoá danh mục");
  };

  // ---- nhập / cập nhật bảng giá từ Excel ----
  const importServices = (rows) => {
    let services = [...data.services];
    let added = 0, updated = 0;
    rows.forEach((r) => {
      const idx = services.findIndex((s) => normalizeStr(s.label) === normalizeStr(r.label) && normalizeStr(s.unit) === normalizeStr(r.unit));
      if (idx >= 0) {
        services[idx] = { ...services[idx], label: r.label, unit: r.unit, unitPrice: r.unitPrice, minQty: r.minQty, minPrice: r.minPrice };
        updated++;
      } else {
        const id = slugify(r.label, services.map((s) => s.id));
        services = [...services, { id, label: r.label, unit: r.unit, minQty: r.minQty, minPrice: r.minPrice, unitPrice: r.unitPrice }];
        added++;
      }
    });
    persist({ ...data, services });
    setShowServiceImport(false);
    showToast(`✅ Cập nhật ${updated} · thêm mới ${added} dịch vụ`);
  };

  // ---- chỉ số điện / nước / hóa chất ----
  const addMeterLog = (log) => {
    const newLog = { ...log, id: data.nextMeterId, createdAt: log.date || Date.now() };
    const merged = [newLog, ...data.meterLogs].sort((a, b) => b.createdAt - a.createdAt);
    persist({ ...data, meterLogs: merged, nextMeterId: data.nextMeterId + 1 });
    setShowNewMeter(false);
    showToast("✅ Đã ghi nhận chỉ số");
  };

  const deleteMeterLog = (id) => {
    persist({ ...data, meterLogs: data.meterLogs.filter((l) => l.id !== id) });
    showToast("🗑 Đã xoá bản ghi");
  };

  // ---- ca làm việc / kết ca ----
  const currentShift = data.shifts.find((s) => s.status === "open") || null;
  const pendingConfirmShift = data.shifts.find((s) => s.status === "closed") || null;

  const openShift = (openingCash) => {
    if (currentShift || pendingConfirmShift) return; // đã có ca mở hoặc đang chờ xác nhận, không mở thêm
    const name = currentUser ? (currentUser.fullName || currentUser.username) : "?";
    const newShift = {
      id: data.nextShiftId,
      openedAt: Date.now(),
      openedById: currentUser ? currentUser.id : null,
      openedByName: name,
      openingCash: openingCash || 0,
      closedAt: null, closedById: null, closedByName: null,
      countedCash: null, expectedCash: null, variance: null, varianceNote: "",
      status: "open",
      confirmedAt: null, confirmedById: null, confirmedByName: null, confirmNote: "",
    };
    persist(withLog(
      { ...data, shifts: [newShift, ...data.shifts], nextShiftId: data.nextShiftId + 1 },
      "shift.open",
      `Mở ca · tiền đầu ca ${fmtMoney(openingCash || 0)}`
    ));
    setShowOpenShift(false);
    showToast("✅ Đã mở ca");
  };

  const closeShift = (countedCash, varianceNote) => {
    if (!currentShift) return;
    const now = Date.now();
    const expectedCash = computeExpectedCash(currentShift, data.orders, data.expenses, now);
    const variance = countedCash - expectedCash;
    const name = currentUser ? (currentUser.fullName || currentUser.username) : "?";
    const updated = {
      ...currentShift,
      status: "closed",
      closedAt: now,
      closedById: currentUser ? currentUser.id : null,
      closedByName: name,
      countedCash,
      expectedCash,
      variance,
      varianceNote: varianceNote || "",
    };
    const desc = variance === 0
      ? `Đóng ca · khớp quỹ ${fmtMoney(countedCash)}`
      : `Đóng ca · thực đếm ${fmtMoney(countedCash)}, ${variance > 0 ? "dư" : "thiếu"} ${fmtMoney(Math.abs(variance))}`;
    persist(withLog(
      { ...data, shifts: data.shifts.map((s) => (s.id === currentShift.id ? updated : s)) },
      "shift.close",
      desc
    ));
    setShowCloseShift(false);
    showToast("✅ Đã đóng ca, chờ ca sau xác nhận");
  };

  const confirmShift = (shiftId, agree, note) => {
    const shift = data.shifts.find((s) => s.id === shiftId);
    if (!shift || shift.status !== "closed") return;
    const name = currentUser ? (currentUser.fullName || currentUser.username) : "?";
    const updated = {
      ...shift,
      status: "confirmed",
      confirmedAt: Date.now(),
      confirmedById: currentUser ? currentUser.id : null,
      confirmedByName: name,
      confirmNote: note || "",
    };
    const desc = agree
      ? `Xác nhận đã nhận đủ ${fmtMoney(shift.countedCash)} bàn giao từ ${shift.closedByName || "?"}`
      : `Báo số tiền bàn giao KHÔNG khớp · ${note || ""}`;
    persist(withLog(
      { ...data, shifts: data.shifts.map((s) => (s.id === shiftId ? updated : s)) },
      "shift.confirm",
      desc
    ));
    showToast(agree ? "✅ Đã xác nhận nhận ca" : "⚠️ Đã ghi nhận báo cáo lệch");
  };

  const deleteShift = (id) => {
    const s = data.shifts.find((x) => x.id === id);
    persist(withLog(
      { ...data, shifts: data.shifts.filter((x) => x.id !== id) },
      "shift.delete",
      `Xoá bản ghi ca ${s ? fmtDate(s.openedAt) : id}`
    ));
    showToast("🗑 Đã xoá bản ghi ca");
  };

  // ---- khách hàng (danh sách gốc) ----
  const saveCustomer = (cust, isNew) => {
    const customers = isNew
      ? [...data.customers, { ...cust, id: data.nextCustomerId, createdAt: Date.now() }]
      : data.customers.map((c) => (c.id === cust.id ? { ...c, ...cust } : c));
    persist({ ...data, customers, nextCustomerId: isNew ? data.nextCustomerId + 1 : data.nextCustomerId });
    setShowNewCustomer(false);
    setEditingCustomer(null);
    showToast(isNew ? "✅ Đã thêm khách hàng" : "✅ Đã cập nhật khách hàng");
  };

  const deleteCustomer = (id) => {
    persist({ ...data, customers: data.customers.filter((c) => c.id !== id) });
    setCustomerDetail(null);
    showToast("🗑 Đã xoá khỏi danh sách khách hàng");
  };

  // ---- đăng nhập / nhân viên ----
  const login = (user) => {
    setCurrentUser(user);
    saveSession(user.id);
    const name = user.fullName || user.username;
    const baseLogs = data.actionLogs || [];
    const baseNextLogId = data.nextLogId || 1;
    const log = { id: baseNextLogId, action: "auth.login", description: `${name} đăng nhập`, userId: user.id, userName: name, ts: Date.now() };
    persist({ ...data, actionLogs: [log, ...baseLogs], nextLogId: baseNextLogId + 1 });
  };

  const logout = async () => {
    if (currentUser) {
      await persist(withLog(data, "auth.logout", `${currentUser.fullName || currentUser.username} đăng xuất`));
    }
    if (hasAuth()) await C3H_AUTH.signOut();
    setCurrentUser(null);
    clearSession();
  };

  // Đổi mật khẩu của chính mình (Supabase Auth)
  const changeMyPassword = async (newPassword) => {
    try {
      await C3H_AUTH.changePassword(newPassword);
      showToast("✅ Đã đổi mật khẩu");
      return true;
    } catch (e) {
      showToast("⚠️ " + (e && e.message ? e.message : "Đổi mật khẩu thất bại"));
      return false;
    }
  };

  const touchesAdmin = (target) => currentUser && currentUser.role !== "admin" && target && target.role === "admin";
  const saveUser = async (u, isNew, plainPassword) => {
    const before = !isNew ? data.users.find((x) => x.id === u.id) : null;
    if (touchesAdmin(u) || touchesAdmin(before)) { showToast("⚠️ Chỉ Admin mới được tạo/sửa tài khoản Admin"); return false; }
    if (hasAuth()) {
      // Tạo/đặt lại mật khẩu tài khoản đăng nhập qua hàm c3h-admin trên Supabase (cần quyền Quản lý/Admin)
      try {
        let authId = u.authId, email = u.email;
        if (isNew || (!authId && plainPassword)) {
          const r = await C3H_AUTH.adminCall({ action: "create", username: u.username, password: plainPassword, fullName: u.fullName });
          authId = r.authId; email = r.email;
        } else if (plainPassword) {
          await C3H_AUTH.adminCall({ action: "setPassword", authId, password: plainPassword });
        }
        if (isNew) {
          const newUser = { id: data.nextUserId, username: u.username, fullName: u.fullName, role: u.role, createdAt: Date.now(), active: true, authId, email };
          persist(withLog(
            { ...data, users: [...data.users, newUser], nextUserId: data.nextUserId + 1 },
            "user.create",
            `Thêm nhân viên ${newUser.fullName || newUser.username} (${roleLabel(newUser.role)})`
          ));
          showToast("✅ Đã thêm nhân viên");
        } else {
          const updated = { ...u, authId, email };
          delete updated.passwordHash;
          persist(withLog(
            { ...data, users: data.users.map((x) => (x.id === u.id ? updated : x)) },
            "user.edit",
            `Sửa nhân viên ${updated.fullName || updated.username}`
          ));
          if (currentUser && currentUser.id === u.id) setCurrentUser(updated);
          showToast("✅ Đã cập nhật nhân viên");
        }
        return true;
      } catch (e) {
        showToast("⚠️ " + (e && e.message ? e.message : "Không lưu được nhân viên"));
        return false;
      }
    }
    if (isNew) {
      const passwordHash = await hashPassword(plainPassword);
      const newUser = {
        id: data.nextUserId,
        username: u.username,
        passwordHash,
        fullName: u.fullName,
        role: u.role,
        createdAt: Date.now(),
        active: true,
      };
      persist(withLog(
        { ...data, users: [...data.users, newUser], nextUserId: data.nextUserId + 1 },
        "user.create",
        `Thêm nhân viên ${newUser.fullName || newUser.username} (${roleLabel(newUser.role)})`
      ));
      showToast("✅ Đã thêm nhân viên");
    } else {
      let passwordHash = u.passwordHash;
      if (plainPassword) passwordHash = await hashPassword(plainPassword);
      const updated = { ...u, passwordHash };
      persist(withLog(
        { ...data, users: data.users.map((x) => (x.id === u.id ? updated : x)) },
        "user.edit",
        `Sửa nhân viên ${updated.fullName || updated.username}`
      ));
      // Nếu đang tự sửa chính mình, cập nhật currentUser luôn
      if (currentUser && currentUser.id === u.id) setCurrentUser(updated);
      showToast("✅ Đã cập nhật nhân viên");
    }
  };

  const toggleUserActive = async (id) => {
    const u = data.users.find((x) => x.id === id);
    if (touchesAdmin(u)) { showToast("⚠️ Chỉ Admin mới được khoá/mở tài khoản Admin"); return; }
    const willActive = u ? u.active === false : true;
    if (hasAuth()) {
      if (currentUser && currentUser.id === id) { showToast("⚠️ Không thể tự khoá tài khoản đang đăng nhập"); return; }
      if (u && u.authId) {
        try { await C3H_AUTH.adminCall({ action: "setActive", authId: u.authId, active: willActive }); }
        catch (e) { showToast("⚠️ " + (e && e.message ? e.message : "Không đổi được trạng thái tài khoản")); return; }
      }
    }
    persist(withLog(
      { ...data, users: data.users.map((x) => (x.id === id ? { ...x, active: !x.active } : x)) },
      "user.toggleActive",
      `${willActive ? "Mở khoá" : "Khoá"} tài khoản ${u ? (u.fullName || u.username) : id}`
    ));
  };

  const deleteUser = async (id) => {
    if (currentUser && currentUser.id === id) {
      showToast("⚠️ Không thể tự xoá tài khoản đang đăng nhập");
      return;
    }
    const u = data.users.find((x) => x.id === id);
    if (touchesAdmin(u)) { showToast("⚠️ Chỉ Admin mới được xoá tài khoản Admin"); return; }
    if (hasAuth() && u && u.authId) {
      try { await C3H_AUTH.adminCall({ action: "delete", authId: u.authId }); }
      catch (e) { showToast("⚠️ " + (e && e.message ? e.message : "Không xoá được tài khoản")); return; }
    }
    persist(withLog(
      { ...data, users: data.users.filter((x) => x.id !== id) },
      "user.delete",
      `Xoá nhân viên ${u ? (u.fullName || u.username) : id}`
    ));
    showToast("🗑 Đã xoá nhân viên");
  };

  // ---- derived ----
  const orders = data.orders;
  const sortedServices = useMemo(() => {
    return [...data.services].sort((a, b) => {
      const ao = a.sortOrder != null ? a.sortOrder : 999999;
      const bo = b.sortOrder != null ? b.sortOrder : 999999;
      return ao - bo || a.label.localeCompare(b.label);
    });
  }, [data.services]);
  // Đơn trong phạm vi ngày đang xem (chưa lọc trạng thái / tìm kiếm) — dùng để đếm số trên các nút lọc
  const dayOrders = useMemo(
    () => (showAllDates ? orders : orders.filter((o) => dateStr(o.createdAt) === viewDate)),
    [orders, viewDate, showAllDates]
  );
  const filtered = useMemo(() => {
    let list = orders;
    if (!showAllDates) list = list.filter((o) => dateStr(o.createdAt) === viewDate);
    if (filter !== "all") list = list.filter((o) => o.status === filter);
    const q = search.trim().toLowerCase();
    if (q) list = list.filter((o) =>
      o.customerName.toLowerCase().includes(q) || (o.phone || "").includes(q) || o.code.toLowerCase().includes(q)
    );
    // Gấp lên đầu, rồi Sớm; còn lại giữ nguyên thứ tự cũ (sort ổn định). Đơn đã hoàn thành không được đẩy lên.
    return [...list].sort((a, b) => priorityOf(b).rank - priorityOf(a).rank);
  }, [orders, filter, search, viewDate, showAllDates]);

  const customers = useMemo(() => {
    const map = {};
    // Bắt đầu từ danh sách khách hàng gốc (có thể chưa có đơn nào)
    data.customers.forEach((c) => {
      const key = c.phone || c.name.toLowerCase();
      map[key] = { key, id: c.id, code: c.code || "", name: c.name, phone: c.phone || "", address: c.address || "", count: 0, total: 0, debt: 0, last: 0, orders: [] };
    });
    // Cộng dồn số liệu từ đơn hàng; khách chưa có trong danh sách gốc vẫn hiện (khách vãng lai)
    orders.forEach((o) => {
      const key = o.phone || o.customerName.toLowerCase();
      if (!map[key]) map[key] = { key, id: null, code: "", name: o.customerName, phone: o.phone, address: "", count: 0, total: 0, debt: 0, last: 0, orders: [] };
      map[key].count += 1;
      map[key].total += o.total;
      if (o.status === "dagiao") map[key].debt += o.total; // đã giao nhưng chưa hoàn thành (thanh toán) = nợ
      map[key].last = Math.max(map[key].last, o.createdAt);
      if (!map[key].id) map[key].name = o.customerName; // khách vãng lai lấy tên theo đơn gần nhất
      map[key].orders.push(o);
    });
    return Object.values(map).sort((a, b) => b.debt - a.debt || b.total - a.total);
  }, [orders, data.customers]);

  if (!loaded) {
    return (
      <div style={{ ...st.app, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: "var(--h6B9B5E)", fontWeight: 700 }}>Đang tải dữ liệu…</div>
      </div>
    );
  }

  if (!currentUser) {
    return <LoginScreen users={data.users} onLogin={login} onAuthLogin={onAuthLogin} loadError={loadError} />;
  }

  // Thu ngân chỉ được vào Đơn hàng / Khách hàng — nếu đang đứng ở tab bị khoá (VD sau khi đổi
  // tài khoản) thì tự chuyển về Đơn hàng để tránh màn trắng.
  const visibleTab = (tab === "expenses" || tab === "report" || tab === "settings") && !can(currentUser, "settings.manage")
    ? "orders"
    : tab;

  const detailOrder = detail != null ? orders.find((o) => o.id === detail) : null;

  return (
    <div style={st.app}>
      <style>{css}</style>

      {/* Header */}
      <header style={st.header}>
        <div>
          <div style={st.brand}>🧺 Cậu 3 Hoàng</div>
          <div style={st.brandSub}>
            {currentUser.fullName || currentUser.username} · {roleLabel(currentUser.role)}
          </div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {can(currentUser, "order.create") && (
            <button style={st.newBtn} onClick={() => setShowNew(true)}>+ Đơn mới</button>
          )}
          {hasAuth() && <button style={st.importBtn} onClick={() => setShowChangePw(true)} title="Đổi mật khẩu">🔑</button>}
          <button style={st.importBtn} onClick={logout} title="Đăng xuất">🚪</button>
        </div>
      </header>

      {/* Body */}
      <main style={st.main}>
        {visibleTab === "orders" && (
          <OrdersTab
            filtered={filtered}
            dayOrders={dayOrders}
            filter={filter}
            setFilter={setFilter}
            search={search}
            setSearch={setSearch}
            onOpen={(o) => setDetail(o.id)}
            onAdvance={advance}
            onRetreat={retreat}
            onJump={jumpTo}
            total={orders.length}
            services={sortedServices}
            viewDate={viewDate}
            setViewDate={setViewDate}
            showAllDates={showAllDates}
            setShowAllDates={setShowAllDates}
          />
        )}
        {visibleTab === "customers" && (
          <CustomersTab
            customers={customers}
            onOpen={(c) => setCustomerDetail(c)}
            onAddNew={() => setShowNewCustomer(true)}
            canManage={can(currentUser, "settings.manage")}
          />
        )}
        {visibleTab === "expenses" && (
          <ExpensesTab
            expenses={data.expenses}
            categories={data.expenseCategories}
            onAdd={() => setShowNewExpense(true)}
            onDelete={deleteExpense}
          />
        )}
        {visibleTab === "ops" && (
          <OperationsTab
            meterLogs={data.meterLogs}
            onAddMeter={() => setShowNewMeter(true)}
            onDeleteMeter={can(currentUser, "settings.manage") ? deleteMeterLog : null}
            shifts={data.shifts}
            orders={data.orders}
            expenses={data.expenses}
            currentUser={currentUser}
            currentShift={currentShift}
            pendingConfirmShift={pendingConfirmShift}
            onOpenShift={() => setShowOpenShift(true)}
            onCloseShift={() => setShowCloseShift(true)}
            onConfirmShift={confirmShift}
            onDeleteShift={can(currentUser, "settings.manage") ? deleteShift : null}
          />
        )}
        {visibleTab === "report" && (
          <ReportTab
            orders={orders}
            expenses={data.expenses}
            services={sortedServices}
            categories={data.expenseCategories}
            customers={customers}
            onOpenOrder={(id) => setDetail(id)}
          />
        )}
        {visibleTab === "settings" && (
          <SettingsTab
            currentUser={currentUser}
            onOpenCategory={() => setShowCategoryMgmt(true)}
            onOpenImport={() => setShowImport(true)}
            onOpenUserMgmt={() => setShowUserMgmt(true)}
            onOpenActivityLog={() => setShowActivityLog(true)}
            onExportData={exportDataToFile}
          />
        )}
      </main>

      {/* Bottom nav */}
      <nav style={st.nav}>
        {[
          { id: "orders", icon: "📋", label: "Đơn hàng" },
          { id: "customers", icon: "👥", label: "Khách hàng" },
          { id: "expenses", icon: "💰", label: "Chi tiền" },
          { id: "ops", icon: "🔧", label: "Vận hành" },
          { id: "report", icon: "📊", label: "Báo cáo" },
          { id: "settings", icon: "⚙️", label: "Cài đặt" },
        ].filter((t) => t.id === "orders" || t.id === "customers" || t.id === "ops" || can(currentUser, "settings.manage")).map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{ ...st.navBtn, color: visibleTab === t.id ? "var(--h6B9B5E)" : "var(--hA89F91)", fontWeight: visibleTab === t.id ? 800 : 600 }}
          >
            <span style={{ fontSize: 20 }}>{t.icon}</span>
            <span style={{ fontSize: 11 }}>{t.label}</span>
          </button>
        ))}
      </nav>

      {/* Modals */}
      {showNew && <NewOrderModal onClose={() => setShowNew(false)} onSave={addOrder} services={sortedServices} customers={customers} orders={data.orders} />}
      {editingOrder && (
        <NewOrderModal
          key={editingOrder.id + (editScan ? ":scan" : "")}
          initial={editingOrder}
          scanned={editScan}
          onClose={() => { setEditingOrder(null); setEditScan(null); }}
          onSave={(o) => { updateOrder(o); setEditScan(null); }}
          services={sortedServices}
          customers={customers}
          orders={data.orders}
        />
      )}
      {askPaymentOrder && (
        <Modal title={"Hoàn thành đơn " + askPaymentOrder.code} onClose={() => setAskPaymentOrder(null)}>
          <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 8 }}>Khách thanh toán bằng cách nào?</div>
          <div style={{ display: "flex", gap: 8 }}>
            {PAYMENT_METHODS.map((m) => (
              <button
                key={m.id}
                style={{ ...st.primaryBtn, flex: 1, marginTop: 0, background: "var(--h6B9B5E)" }}
                onClick={() => confirmAdvancePayment(m.id)}
              >
                {m.label}
              </button>
            ))}
          </div>
          <button style={{ ...st.linkBtn, marginTop: 10, display: "block", textAlign: "center", width: "100%" }} onClick={() => setAskPaymentOrder(null)}>
            Huỷ
          </button>
        </Modal>
      )}
      {showNewExpense && <NewExpenseModal onClose={() => setShowNewExpense(false)} onSave={addExpense} categories={data.expenseCategories} />}
      {showNewMeter && <NewMeterLogModal onClose={() => setShowNewMeter(false)} onSave={addMeterLog} />}
      {showOpenShift && (
        <OpenShiftModal
          suggested={data.shifts.find((s) => s.status === "confirmed")?.countedCash}
          onClose={() => setShowOpenShift(false)}
          onSave={openShift}
        />
      )}
      {showCloseShift && currentShift && (
        <CloseShiftModal
          shift={currentShift}
          onClose={() => setShowCloseShift(false)}
          onSave={closeShift}
        />
      )}
      {showImport && <ImportModal onClose={() => setShowImport(false)} onImport={bulkAddOrders} services={sortedServices} />}
      {detailOrder && (
        <OrderDetailModal
          order={detailOrder}
          onClose={() => setDetail(null)}
          onSetStatus={(sid, method) => setStatus(detailOrder.id, sid, method)}
          onDelete={() => deleteOrder(detailOrder.id)}
          onEdit={() => { setDetail(null); setEditScan(null); setEditingOrder(detailOrder); }}
          onScanned={canScanBill() ? (f) => { setDetail(null); setEditScan(f); setEditingOrder(detailOrder); } : null}
          onPrint={FEATURE_PRINT_BILL ? () => setBillOrder(detailOrder) : null}
          onSetPriority={(level) => setOrderPriority(detailOrder.id, level)}
          services={sortedServices}
          canDelete={can(currentUser, "order.delete")}
        />
      )}
      {billOrder && (
        <BillPreviewModal
          order={billOrder}
          services={sortedServices}
          cashier={currentUser ? (currentUser.fullName || currentUser.username) : ""}
          onClose={() => setBillOrder(null)}
        />
      )}
      {showChangePw && <ChangePasswordModal onClose={() => setShowChangePw(false)} onSave={changeMyPassword} />}

      {showUserMgmt && (
        <UserManagementModal
          users={data.users}
          currentUser={currentUser}
          onClose={() => setShowUserMgmt(false)}
          onSave={saveUser}
          onToggleActive={toggleUserActive}
          onDelete={deleteUser}
        />
      )}
      {showCategoryMgmt && (
        <CategoryManagementModal
          services={sortedServices}
          categories={data.expenseCategories}
          onClose={() => setShowCategoryMgmt(false)}
          onSaveService={saveService}
          onDeleteService={deleteService}
          onSaveCategory={saveExpenseCategory}
          onDeleteCategory={deleteExpenseCategory}
          onOpenImport={() => setShowServiceImport(true)}
        />
      )}
      {showServiceImport && (
        <ServiceImportModal
          services={sortedServices}
          onClose={() => setShowServiceImport(false)}
          onImport={importServices}
        />
      )}
      {showActivityLog && currentUser.role === "admin" && (
        <ActivityLogModal logs={data.actionLogs || []} onClose={() => setShowActivityLog(false)} />
      )}
      {customerDetail && (
        <CustomerDetailModal
          customer={customers.find((c) => c.key === customerDetail.key) || customerDetail}
          onClose={() => setCustomerDetail(null)}
          onOpenOrder={(id) => { setCustomerDetail(null); setDetail(id); }}
          onEdit={(c) => { setCustomerDetail(null); setEditingCustomer(c); }}
          onDelete={(id) => deleteCustomer(id)}
          services={sortedServices}
          canManage={can(currentUser, "settings.manage")}
        />
      )}
      {(showNewCustomer || editingCustomer) && (
        <NewCustomerModal
          initial={editingCustomer}
          onClose={() => { setShowNewCustomer(false); setEditingCustomer(null); }}
          onSave={saveCustomer}
        />
      )}

      {undoInfo ? (
        <div style={{ ...st.toast, display: "flex", alignItems: "center", gap: 12 }}>
          <span>{undoInfo.name} → {undoInfo.toLabel}</span>
          <button style={st.undoBtn} onClick={undoStatus}>Hoàn tác</button>
        </div>
      ) : (
        toast && <div style={st.toast}>{toast}</div>
      )}
    </div>
  );
}

/* ================= BẢNG TIẾN ĐỘ (xem nhanh, chỉ để xem — chạm vào đơn để mở và sửa) ================= */
const BOARD_LABELS = ["Nhận", "Giặt", "Chờ", "Giao", "Xong"]; // viết gọn cho vừa màn hình iPhone
function ProgressBoard({ orders, onOpen }) {
  const COLS = "minmax(0,1fr) repeat(5, 42px)";
  const counts = STATUSES.map((s) => orders.filter((o) => o.status === s.id).length);
  const doneCount = counts[STATUSES.length - 1];
  const gridStyle = { display: "grid", gridTemplateColumns: COLS, alignItems: "center", padding: "0 8px 0 12px" };
  return (
    <div>
      <div style={{ fontSize: 13, color: "var(--h8B7E6A)", fontWeight: 600, margin: "0 4px 8px" }}>
        <b style={{ color: "var(--h4A3B2A)", fontWeight: 800 }}>{orders.length} đơn</b> · {doneCount} đã xong · {orders.length - doneCount} đang làm
      </div>
      <div style={{ background: "var(--hFFF)", border: "1px solid var(--hE5DCC9)", borderRadius: 16, overflow: "hidden" }}>
        <div style={{ ...gridStyle, paddingTop: 10, paddingBottom: 8, borderBottom: "1px solid var(--hE5DCC9)" }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: "var(--h8B7E6A)" }}>Khách</div>
          {STATUSES.map((s, i) => (
            <div key={s.id} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 1 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: s.color, display: "block", marginBottom: 2 }} />
              <span style={{ fontSize: 11.5, fontWeight: 800, color: "var(--h8B7E6A)", lineHeight: 1.1 }}>{BOARD_LABELS[i]}</span>
              <b style={{ fontSize: 16, fontWeight: 800, color: "var(--h4A3B2A)", lineHeight: 1.1 }}>{counts[i]}</b>
            </div>
          ))}
        </div>
        {orders.map((o, r) => {
          const idx = statusIndex(o.status);
          const s = statusOf(o.status);
          const pr = priorityOf(o);
          const done = o.status === "hoanthanh";
          return (
            <button
              key={o.id}
              type="button"
              aria-label={`Đơn ${o.customerName}, ${s.label}${pr.bar ? ", " + pr.label : ""}. Chạm để mở đơn`}
              onClick={() => onOpen(o)}
              style={{
                ...gridStyle, width: "100%", minHeight: 48, border: 0, borderTop: r === 0 ? 0 : "1px solid var(--hE5DCC9)",
                background: pr.id === "gap" ? "var(--hFDEDE9)" : pr.id === "uutien" ? "var(--hFBEEDF)" : "transparent",
                fontFamily: "inherit", color: "var(--h4A3B2A)", textAlign: "left", cursor: "pointer",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                <span style={{ fontWeight: done ? 700 : 800, fontSize: 15, color: done ? "var(--h8B7E6A)" : "var(--h4A3B2A)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{o.customerName}</span>
                {pr.bar && (
                  // Cờ nhỏ (đặc = Gấp, rỗng = Sớm) để tên khách còn nhiều chỗ; màu nền hàng cũng đổi theo mức ưu tiên
                  <svg width="15" height="15" viewBox="0 0 24 24" role="img" aria-label={pr.label} style={{ flex: "none" }} fill={pr.id === "gap" ? pr.color : "none"} stroke={pr.color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 21V4" fill="none" /><path d="M5 4h12l-2.5 4L17 12H5" /></svg>
                )}
              </div>
              {STATUSES.map((x, i) => {
                const isNow = i === idx;
                const filled = i <= idx;
                return (
                  <div key={x.id} style={{ height: 48, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <span style={{
                      width: 36, height: isNow ? 16 : 12, borderRadius: isNow ? 8 : 6,
                      background: filled ? s.color : "var(--hE5DCC9)",
                      opacity: filled && !isNow ? 0.38 : 1,
                      display: "flex", alignItems: "center", justifyContent: "center",
                    }}>
                      {isNow && done && (
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--hFFF)" strokeWidth="3.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
                      )}
                    </span>
                  </div>
                );
              })}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap", padding: "12px 6px 0", fontSize: 12.5, color: "var(--h8B7E6A)", fontWeight: 600 }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 22, height: 10, borderRadius: 5, background: "var(--h4A90C2)", opacity: 0.38, display: "inline-block" }} />Đã qua</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 22, height: 14, borderRadius: 7, background: "var(--h4A90C2)", display: "inline-block" }} />Đang ở bước này</span>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 22, height: 10, borderRadius: 5, background: "var(--hE5DCC9)", display: "inline-block" }} />Chưa tới</span>
      </div>
      <div style={{ padding: "10px 6px 0", fontSize: 13, color: "var(--h4A3B2A)", fontWeight: 700 }}>
        › Chạm vào một đơn để mở và sửa bill
      </div>
    </div>
  );
}

/* ================= ORDERS TAB ================= */
function OrdersTab({ filtered, dayOrders, filter, setFilter, search, setSearch, onOpen, onAdvance, onRetreat, onJump, total, services, viewDate, setViewDate, showAllDates, setShowAllDates }) {
  const [pickId, setPickId] = useState(null); // đơn đang mở danh sách chọn trạng thái
  const [view, setView] = useState(() => { try { return localStorage.getItem("c3h-orders-view") === "board" ? "board" : "list"; } catch (e) { return "list"; } });
  const pickView = (v) => { setView(v); try { localStorage.setItem("c3h-orders-view", v); } catch (e) {} };
  // Bảng tiến độ: đơn của ngày đang xem (có áp dụng ô tìm kiếm, bỏ lọc trạng thái); Gấp/Sớm lên đầu, đơn đã xong xuống cuối
  const boardOrders = (() => {
    const q = search.trim().toLowerCase();
    let list = dayOrders;
    if (q) list = list.filter((o) => o.customerName.toLowerCase().includes(q) || (o.phone || "").includes(q) || o.code.toLowerCase().includes(q));
    return [...list].sort((a, b) => ((a.status === "hoanthanh") - (b.status === "hoanthanh")) || (priorityOf(b).rank - priorityOf(a).rank));
  })();
  const chips = [
    { id: "all", label: "Tất cả" },
    ...STATUSES.map((s) => ({ id: s.id, label: s.label })),
  ];
  const chipCount = (id) => {
    if (id === "all") return dayOrders.length;
    return dayOrders.filter((o) => o.status === id).length;
  };
  const isToday = viewDate === todayStr();
  const shiftDate = (deltaDays) => {
    const d = new Date(viewDate + "T00:00:00");
    d.setDate(d.getDate() + deltaDays);
    setViewDate(dateStr(d.getTime()));
    setShowAllDates(false);
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 4, padding: 4, marginBottom: 10, border: "1.5px solid var(--hE5DCC9)", borderRadius: 14, background: "var(--hF3ECDD)" }}>
        {[{ id: "list", label: "Danh sách" }, { id: "board", label: "Tiến độ" }].map((v) => (
          <button
            key={v.id}
            type="button"
            aria-pressed={view === v.id}
            onClick={() => pickView(v.id)}
            style={{
              flex: 1, minHeight: 44, border: 0, borderRadius: 10, fontFamily: "inherit", cursor: "pointer",
              fontSize: 14.5, fontWeight: view === v.id ? 800 : 700,
              background: view === v.id ? "var(--hFFF)" : "transparent",
              color: view === v.id ? "var(--h4A3B2A)" : "var(--h8B7E6A)",
              boxShadow: view === v.id ? "0 0 0 1px var(--hE5DCC9)" : "none",
            }}
          >
            {v.label}
          </button>
        ))}
      </div>
      <input
        style={st.search}
        placeholder="🔍 Tìm tên, SĐT, mã đơn…"
        value={search}
        onChange={(e) => setSearch(e.target.value)}
      />

      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
        <button style={{ ...st.smallBtn, padding: "8px 10px" }} onClick={() => shiftDate(-1)} disabled={showAllDates}>◀</button>
        <input
          type="date"
          style={{ ...st.input, flex: 1, padding: "8px 10px" }}
          value={viewDate}
          onChange={(e) => { setViewDate(e.target.value); setShowAllDates(false); }}
          disabled={showAllDates}
        />
        <button style={{ ...st.smallBtn, padding: "8px 10px" }} onClick={() => shiftDate(1)} disabled={showAllDates}>▶</button>
        {!isToday && !showAllDates && (
          <button style={{ ...st.smallBtn, padding: "8px 10px" }} onClick={() => setViewDate(todayStr())}>Hôm nay</button>
        )}
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--h8B7E6A)", fontWeight: 700, marginBottom: 10 }}>
        <input type="checkbox" checked={showAllDates} onChange={(e) => setShowAllDates(e.target.checked)} style={{ width: 15, height: 15 }} />
        Xem tất cả các ngày (bỏ lọc theo ngày)
      </label>

      {view === "list" && <div style={st.chipRow}>
        {chips.map((c) => (
          <button
            key={c.id}
            onClick={() => setFilter(c.id)}
            style={{
              ...st.chip,
              background: filter === c.id ? "var(--h6B9B5E)" : "var(--hFFF)",
              color: filter === c.id ? "var(--hFFF)" : "var(--h4A3B2A)",
              borderColor: filter === c.id ? "var(--h6B9B5E)" : "var(--hE5DCC9)",
            }}
          >
            {c.label}{chipCount(c.id) > 0 ? ` (${chipCount(c.id)})` : ""}
          </button>
        ))}
      </div>}

      {view === "board" && (
        boardOrders.length === 0
          ? <div style={st.empty}>{total === 0 ? "Chưa có đơn nào." : (!showAllDates ? (isToday ? "Chưa có đơn nào hôm nay." : "Không có đơn nào trong ngày này.") : "Không có đơn nào khớp.")}</div>
          : <ProgressBoard orders={boardOrders} onOpen={onOpen} />
      )}

      {view === "list" && filtered.length === 0 && (
        <div style={st.empty}>
          {total === 0
            ? "Chưa có đơn nào. Bấm “+ Đơn mới” để tạo đơn đầu tiên 🧺"
            : (!showAllDates ? (isToday ? "Chưa có đơn nào hôm nay." : "Không có đơn nào trong ngày này.") : "Không có đơn nào khớp bộ lọc.")}
        </div>
      )}

      {view === "list" && filtered.map((o) => {
        const s = statusOf(o.status);
        const idx = statusIndex(o.status);
        const nextS = idx < STATUSES.length - 1 ? STATUSES[idx + 1] : null;
        const picking = pickId === o.id;
        // Nhãn tiền: tách rõ "Đã giao nhưng chưa thu tiền" (nợ) với "Hoàn thành đã thu tiền"
        const payMethodLabel = (PAYMENT_METHODS.find((m) => m.id === o.paymentMethod)?.label || "").replace(/^\S+\s/, "");
        const payTag =
          o.status === "dagiao" ? { text: "Chưa thu tiền", color: "var(--hC0392B)", bg: "var(--hFDEDE9)" }
          : o.status === "hoanthanh" ? { text: "Đã thu" + (payMethodLabel ? " · " + payMethodLabel : ""), color: "var(--h5C8A4E)", bg: "var(--hF3F8ED)" }
          : null;
        const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
        const pr = priorityOf(o);
        return (
          <div key={o.id} style={{ ...st.card, padding: "12px 13px", ...(pr.bar ? { borderLeft: "5px solid " + pr.bar } : {}) }} onClick={() => onOpen(o)}>
            {/* Hàng trên: tên + mã đơn + giờ tạo, bên phải là nút lùi + nhãn trạng thái */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
              <div style={{ minWidth: 0, display: "flex", flexWrap: "wrap", alignItems: "baseline", columnGap: 6 }}>
                {pr.bar && <span style={{ fontSize: 11, fontWeight: 800, letterSpacing: "0.02em", color: pr.color, background: pr.bg, borderRadius: 8, padding: "1px 7px", alignSelf: "center" }}>{pr.label.toUpperCase()}</span>}
                <span style={{ fontWeight: 800, fontSize: 16, lineHeight: 1.2, overflowWrap: "anywhere" }}>{o.customerName}</span>
                <span style={{ color: "var(--hB0A695)", fontWeight: 600, fontSize: 11.5 }}>{o.code} · {fmtDate(o.createdAt)}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flex: "none" }}>
                {idx > 0 && (
                  <button style={st.retreatBtn} aria-label={"Lùi về " + STATUSES[idx - 1].label} onClick={stop(() => onRetreat(o))}>↩</button>
                )}
                <button
                  style={{ ...st.statusChip, color: s.color, background: s.bg }}
                  aria-expanded={picking}
                  onClick={stop(() => setPickId(picking ? null : o.id))}
                >
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: s.color, display: "inline-block" }} />
                  {s.label} ▾
                </button>
              </div>
            </div>
            {/* Hàng dưới: món + tiền bên trái, nút hành động bên phải */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginTop: 8 }}>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontSize: 12.5, color: "var(--h8B7E6A)", overflowWrap: "anywhere" }}>
                  {o.items.map((it) => { const sv = serviceOf(services, it.service); return sv.label + " " + it.qty + " " + sv.unit; }).join(" · ")}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginTop: 5 }}>
                  <span style={{ fontWeight: 800, color: "var(--h6B9B5E)", fontSize: 15 }}>{fmtMoney(o.total)}</span>

// Thu nhỏ ảnh chụp bill (tối đa 1600px, JPEG) để gửi lên nhanh và đỡ tốn dữ liệu 4G.
function fileToJpegBase64(file, maxSide = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k));
        const h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const out = c.toDataURL("image/jpeg", quality).split(",")[1];
        URL.revokeObjectURL(url);
        resolve(out);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Không mở được ảnh này")); };
    img.src = url;
  });
}

// Đổi kết quả AI đọc được thành dữ liệu điền vào form tạo đơn.
// Dịch vụ: ưu tiên serviceId AI chọn (nếu có trong danh mục), rồi tới so tên, cuối cùng để dịch vụ mặc định + báo "chưa khớp".
// Giá: luôn tính theo bảng giá của app (cùng công thức với nhập tay); form sẽ so tổng với tổng trên bill để anh đối chiếu.
function billToForm(bill, services) {
  const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };
  const unmatched = [];
  const items = [];
  (bill.items || []).forEach((ln) => {
    const qty = num(ln.qty);
    if (!(qty > 0)) return;
    let sid = ln.serviceId && services.some((s) => s.id === ln.serviceId) ? ln.serviceId : matchService(services, ln.name || "");
    if (!sid) { sid = findDefaultService(services); unmatched.push(ln.name || "?"); }
    const auto = calcPrice(services, sid, qty);
    const amount = num(ln.amount);
    // Dịch vụ chưa có giá trong danh mục -> lấy thành tiền trên bill, đánh dấu "giá sửa tay"
    const manual = !auto && amount > 0;
    items.push({ service: sid, qty: String(qty), price: manual ? Math.round(amount) : auto, manual });
  });
  const phone = String(bill.phone || "").replace(/\D/g, "");
  return {
    name: String(bill.customerName || "").trim(),
    phone,
    items,
    unmatched,
    posRef: String(bill.billNumber || "").trim(),
    billTime: bill.billTime || "",
    billTotal: num(bill.total) || 0,
    unsure: Array.isArray(bill.unsure) ? bill.unsure : [],
  };
}

// Quét bill đã tính tiền trên POS365 -> dữ liệu để cập nhật vào đơn có sẵn
const canScanBill = () => hasAuth() && typeof C3H_AUTH.ocrBill === "function";
async function scanBillToForm(file, services) {
  const b64 = await fileToJpegBase64(file);
  const bill = await C3H_AUTH.ocrBill(
    b64, "image/jpeg",
    services.map((s) => ({ id: s.id, label: s.label, unit: s.unit, unitPrice: s.unitPrice || 0 }))
  );
  if (bill.isBill === false) throw new Error("Ảnh này không giống hoá đơn — hãy chụp lại cả tờ bill");
  const f = billToForm(bill, services);
  if (!f.items.length) throw new Error("Không thấy dòng dịch vụ nào trên bill — hãy chụp lại rõ hơn");
  return f;
}
// Bill có đúng là của khách trong đơn này không (so SĐT, không có SĐT thì so tên)
function billCustomerMismatch(f, order) {
  if (!f || !order) return false;
  const op = String(order.phone || "").replace(/\D/g, "");
  if (f.phone && op) return f.phone !== op;
  if (f.name && order.customerName) return normalizeStr(f.name).replace(/\s+/g, " ").trim() !== normalizeStr(order.customerName).replace(/\s+/g, " ").trim();
  return false;
}

// Dịch vụ mặc định khi tạo đơn mới: ưu tiên "Quần Áo" đơn giá 8.000đ/kg
// (loại phổ biến nhất), nếu không tìm thấy thì rơi về dịch vụ đầu danh sách.
function findDefaultService(services) {
  const byPrice8k = services.find((s) => {
    const n = normalizeStr(s.label);
    return (s.unitPrice === 8000) && n.includes("quan ao") && !n.includes("duoi");
  });
  if (byPrice8k) return byPrice8k.id;
  const byId = services.find((s) => s.id === "quanao");
  if (byId) return byId.id;
  return services[0]?.id;
}

  const isEdit = !!initial;

  const [phone, setPhone] = useState(initial?.phone || (scanned && scanned.phone) || "");
  const [note, setNote] = useState(initial?.note || "");
  const [priority, setPriority] = useState(initial?.priority || "thuong");
  const [posRef, setPosRef] = useState((scanned && scanned.posRef) || initial?.posRef || "");
  const [scan, setScan] = useState(scanned ? { info: scanned } : null); // null | { busy } | { error } | { info }
  const scanInputRef = React.useRef(null);
  const [status, setStatus] = useState(initial?.status || "tiepnhan");
  const [paymentMethod, setPaymentMethod] = useState(initial?.paymentMethod || "tienmat");
  const [items, setItems] = useState(
    scanned && scanned.items && scanned.items.length
      ? scanned.items
      : initial?.items?.length
      ? initial.items.map((it) => {
          // Chỉ đánh dấu "giá sửa tay" nếu giá đang lưu KHÁC với giá tự tính theo
          // công thức hiện tại (nghĩa là trước đó người dùng đã chỉnh tay thật sự).
          // Nếu giá khớp với công thức thì để tự động, để khi sửa số kg giá vẫn tự nhảy theo.
          const autoPrice = calcPrice(services, it.service, it.qty);
          const isManual = (it.price || 0) !== autoPrice;
          return { service: it.service, qty: it.qty ? String(it.qty) : "", price: it.price || 0, manual: isManual };
        })
      : [{ service: findDefaultService(services), qty: "", price: 0, manual: false }]
  );
  const [showSuggest, setShowSuggest] = useState(false);
  const [pickedKey, setPickedKey] = useState(null);
  const [showCustomerPicker, setShowCustomerPicker] = useState(false);
  const [showServicePicker, setShowServicePicker] = useState(false);

  const suggestions = useMemo(() => {
    const q = name.trim().toLowerCase();
    if (!q || pickedKey) return [];
    return customers.filter((c) => c.name.toLowerCase().includes(q)).slice(0, 6);
  }, [name, customers, pickedKey]);

  const isNewCustomer = name.trim() && !pickedKey && !customers.some((c) => c.name.trim().toLowerCase() === name.trim().toLowerCase());

  const pickCustomer = (c) => {
    setName(c.name);
    setPhone(c.phone || "");
    setPickedKey(c.key);
    setShowSuggest(false);
    setShowCustomerPicker(false);
  };

  const handleNameChange = (v) => {
    setName(v);
    setPickedKey(null);
    setShowSuggest(true);
  };

  const handleScanFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // cho phép chọn lại cùng 1 ảnh
    if (!file) return;
    setScan({ busy: true });
    try {
      const f = await scanBillToForm(file, services);
      // Đơn đã có: giữ tên khách của đơn; chỉ điền SĐT nếu đơn chưa có. Dịch vụ/số kg lấy theo bill đã tính tiền.
      if (f.phone && !phone.trim()) setPhone(f.phone);
      setItems(f.items);
      if (f.posRef) setPosRef(f.posRef);
      setScan({ info: f });
    } catch (err) {
      setScan({ error: String((err && err.message) || err) });
    }
  };

  const updateItem = (i, patch) => {
    setItems(items.map((it, idx) => {
      if (idx !== i) return it;
      const next = { ...it, ...patch };
      if (!next.manual && (patch.qty !== undefined || patch.service !== undefined)) {
        next.price = calcPrice(services, next.service, next.qty);
      }
      return next;
    }));
  };

  const subtotal = items.reduce((s, it) => s + (parseFloat(it.price) || 0), 0);
  const tax = Math.round(subtotal * TAX_RATE);
  const total = subtotal + tax;
  // Cho phép lưu đơn dù chưa nhập số lượng/kg ở BẤT KỲ trạng thái nào — lúc nhận đồ
  // có thể chưa cân được ngay, sẽ cập nhật số lượng sau. Chỉ bắt buộc có tên khách.
  const hasNoQty = !items.some((it) => parseQty(it.qty) > 0);

  return (
    <Modal title={isEdit ? `Sửa đơn ${initial.code}` : "Tạo đơn mới"} onClose={onClose}>

          <input ref={scanInputRef} type="file" accept="image/*" onChange={handleScanFile} style={{ display: "none" }} />

            type="button"

              width: "100%", minHeight: 52, borderRadius: 14, border: "2px dashed var(--hD68C45)",

          </button>
          {scan && scan.error && (
            <div style={{ fontSize: 12.5, background: "var(--hFDEDE9)", color: "var(--hC0392B)", padding: 10, borderRadius: 10, marginTop: 8, fontWeight: 700 }}>
              ⚠️ {scan.error}
            </div>
          )}
          {scan && scan.info && (() => {
            const f = scan.info;
            const diff = f.billTotal ? total - f.billTotal : 0;
            const ok = f.billTotal && Math.abs(diff) <= 1;
            return (
              <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                <div style={{ fontSize: 12.5, background: "var(--hF3F8ED)", color: "var(--h5C8A4E)", padding: 10, borderRadius: 10, fontWeight: 700 }}>
                  ✅ Đã đọc bill{f.posRef ? " " + f.posRef : ""}{f.billTime ? " · " + f.billTime : ""} — dịch vụ và số kg đã cập nhật theo bill, kiểm tra rồi bấm Lưu thay đổi
                </div>
                {billCustomerMismatch(f, { customerName: name, phone }) && (
                  <div style={{ fontSize: 12.5, background: "var(--hFDEDE9)", color: "var(--hC0392B)", padding: 10, borderRadius: 10, fontWeight: 700 }}>

                  </div>

                {f.billTotal > 0 && (
                  <div style={{
                    fontSize: 12.5, padding: 10, borderRadius: 10, fontWeight: 700,
                    background: ok ? "var(--hF3F8ED)" : "var(--hFBEEDF)", color: ok ? "var(--h5C8A4E)" : "var(--h8A5A1C)",
                  }}>

                      ? `✅ Tổng khớp bill: ${fmtMoney(f.billTotal)}`

                  </div>

                {f.unmatched.length > 0 && (
                  <div style={{ fontSize: 12.5, background: "var(--hFBEEDF)", color: "var(--h8A5A1C)", padding: 10, borderRadius: 10, fontWeight: 700 }}>

                  </div>
                )}
              </div>
            );
          })()}
        </div>

      {(() => {
        const dup = posRef && (orders || []).find((o) => o.posRef && o.posRef === posRef && !(initial && o.id === initial.id));
        return dup ? (

      })()}
      <label style={st.label}>Tên khách *</label>
      <div style={{ display: "flex", gap: 8, minWidth: 0 }}>
        <div style={{ position: "relative", flex: 1, minWidth: 0 }}>
          <input
            style={st.input}

      <input style={st.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="VD: có vết bẩn cần tẩy, giao 17h…" />

      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--h8B7E6A)", marginTop: 10, padding: "0 2px" }}>
        <span>Tiền dịch vụ</span>
        <span>{fmtMoney(subtotal)}</span>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--h8B7E6A)", marginTop: 4, padding: "0 2px" }}>
        <span>Thuế (8%)</span>
        <span>{fmtMoney(tax)}</span>
      </div>

      <div style={st.totalRow}>
        <span>Tổng cộng</span>
        <span style={{ fontWeight: 800, color: "var(--h6B9B5E)", fontSize: 18 }}>{fmtMoney(total)}</span>
      </div>

      <button
        style={{ ...st.primaryBtn, opacity: valid ? 1 : 0.4 }}
        disabled={!valid}
        onClick={() =>
          onSave({
            ...(isEdit ? { id: initial.id } : {}),
            customerName: name.trim(),
            phone: phone.trim(),
            note: note.trim(),
            priority,
            posRef: posRef || null,
            status,
            paymentMethod: status === "hoanthanh" ? paymentMethod : null,
            items: (() => {
              const withQty = items.filter((it) => parseQty(it.qty) > 0);
              const base = withQty.length ? withQty : items.slice(0, 1);
              return base.map((it) => ({ service: it.service, qty: parseQty(it.qty), price: parseFloat(it.price) || 0 }));
            })(),
            subtotal,
            tax,
            total,
          })
        }
      >
        {isEdit ? "Lưu thay đổi" : "Lưu đơn hàng"}
      </button>

      {showCustomerPicker && (
        <CustomerPickerModal
          customers={customers}
          onClose={() => setShowCustomerPicker(false)}
          onPick={pickCustomer}
        />
      )}
      {showServicePicker && (
        <ServicePickerModal
          services={services}
          initialItems={items}
          onClose={() => setShowServicePicker(false)}
          onConfirm={(pickedItems) => {
            setItems(pickedItems);
            setShowServicePicker(false);
          }}
        />
      )}
    </Modal>
  );
}
