/* ================= CHỌN DỊCH VỤ (popup, số lượng kiểu +/-) ================= */
function ServicePickerModal({ services, initialItems, onClose, onConfirm }) {
  // qtyMap lưu CHUỖI thô đang gõ (VD "1.", "1.5") — không parse ngay khi gõ,
  // để không "nuốt" mất dấu chấm/phẩy thập phân đang gõ dở. Chỉ parseQty() khi
  // cần tính toán (giá, tổng tiền, xác nhận).
  const [qtyMap, setQtyMap] = useState(() => {
    const sums = {};
    (initialItems || []).forEach((it) => {
      const q = parseQty(it.qty);
      if (q > 0) sums[it.service] = (sums[it.service] || 0) + q;
    });
    const m = {};
    Object.keys(sums).forEach((id) => { m[id] = String(sums[id]); });
    return m;
  });

  const setQty = (serviceId, rawValue) => {
    setQtyMap((prev) => {
      const next = { ...prev };
      if (parseQty(rawValue) <= 0 && !String(rawValue).trim()) delete next[serviceId];
      else next[serviceId] = rawValue;
      return next;
    });
  };
  const step = (svc, delta) => {
    const cur = parseQty(qtyMap[svc.id]);
    const unitStep = svc.unit === "kg" ? 1 : 1;
    const next = Math.max(0, Math.round((cur + delta * unitStep) * 10) / 10);
    setQtyMap((prev) => {
      const nextMap = { ...prev };
      if (next <= 0) delete nextMap[svc.id];
      else nextMap[svc.id] = String(next);
      return nextMap;
    });
  };

  const totalCount = Object.keys(qtyMap).filter((id) => parseQty(qtyMap[id]) > 0).length;
  const totalMoney = services.reduce((s, svc) => s + calcPrice(services, svc.id, parseQty(qtyMap[svc.id])), 0);

  return (
    <Modal title="🛒 Chọn dịch vụ" onClose={onClose}>
      <div>
        {services.map((svc) => {
          const rawQty = qtyMap[svc.id] || "";
          const qty = parseQty(rawQty);
          const active = qty > 0;
          const lineTotal = calcPrice(services, svc.id, qty);
          return (
            <div
              key={svc.id}
              style={{
                ...st.card,
                borderColor: active ? "var(--h6B9B5E)" : "var(--hEDE4D3)",
                borderWidth: active ? 2 : 1,
                marginBottom: 8,
              }}
            >
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 800, fontSize: 14 }}>{svc.label}</div>
                  <div style={{ fontSize: 12, color: "var(--h4A90C2)" }}>{pricingLabel(svc)}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                  <button
                    style={{ ...st.stepBtn }}
                    onClick={() => step(svc, -1)}
                    disabled={qty <= 0}
                  >
                    −
                  </button>
                  <input
                    style={{ ...st.input, width: 56, textAlign: "center", padding: "8px 4px" }}
                    value={rawQty}
                    placeholder="0"
                    inputMode="decimal"
                    onChange={(e) => setQty(svc.id, e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                  <button style={{ ...st.stepBtn }} onClick={() => step(svc, 1)}>+</button>
                </div>
              </div>
              {active && (
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 12, color: "var(--h8B7E6A)" }}>
                  <span>Thành tiền</span>
                  <span style={{ fontWeight: 700, color: "var(--h6B9B5E)" }}>{fmtMoney(lineTotal)}</span>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <button
        style={{ ...st.primaryBtn, opacity: totalCount ? 1 : 0.4, position: "sticky", bottom: 0 }}
        disabled={!totalCount}
        onClick={() => {
          const items = services
            .filter((svc) => parseQty(qtyMap[svc.id]) > 0)
            .map((svc) => {
              const q = parseQty(qtyMap[svc.id]);
              return { service: svc.id, qty: String(q), price: calcPrice(services, svc.id, q), manual: false };
            });
          onConfirm(items);
        }}
      >
        {totalCount ? `Chọn ${totalCount} dịch vụ · ${fmtMoney(totalMoney)}` : "Chọn dịch vụ"}
      </button>
    </Modal>
  );
}

/* ================= IMPORT EXCEL ================= */
function ImportModal({ onClose, onImport, services }) {
  const [stage, setStage] = useState("upload"); // upload | map
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const [map, setMap] = useState({
    customerName: "", phone: "", serviceMode: "column", serviceCol: "", fixedService: services[0]?.id,
    qty: "", price: "", note: "", status: "", date: "",
  });

  const col = (idx) => (idx === "" ? null : parseInt(idx, 10));

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
      if (!raw.length) { setError("File trống, không có dữ liệu."); return; }
      const hdr = raw[0].map((h, i) => (h && String(h).trim()) || `Cột ${i + 1}`);
      const body = raw.slice(1).filter((r) => r.some((c) => String(c).trim() !== ""));
      if (!body.length) { setError("File chỉ có dòng tiêu đề, không có dữ liệu bên dưới."); return; }
      setHeaders(hdr);
      setRows(body);
      setFileName(file.name);
      setStage("map");
    } catch (err) {
      setError("Không đọc được file. Hãy chắc file là .xlsx, .xls hoặc .csv hợp lệ.");
    }
  };

  const preview = useMemo(() => {
    if (stage !== "map") return [];
    return rows.slice(0, 5).map((r) => {
      const cName = col(map.customerName) != null ? parseExcelValue(r[col(map.customerName)]) : "";
      let serviceId = map.serviceMode === "fixed" ? map.fixedService
        : col(map.serviceCol) != null ? matchService(services, r[col(map.serviceCol)]) : null;
      const qty = col(map.qty) != null ? parseExcelQty(r[col(map.qty)]) : 0;
      const priceRaw = col(map.price) != null ? parseExcelPrice(r[col(map.price)]) : null;
      const price = priceRaw != null ? priceRaw : calcPrice(services, serviceId, qty);
      return { cName, serviceId, qty, price };
    });
  }, [rows, map, stage, services]);

  const unmatchedCount = useMemo(() => {
    if (map.serviceMode === "fixed" || col(map.serviceCol) == null) return 0;
    return rows.filter((r) => !matchService(services, r[col(map.serviceCol)])).length;
  }, [rows, map, services]);

  const valid = col(map.customerName) != null && col(map.qty) != null &&
    (map.serviceMode === "fixed" || col(map.serviceCol) != null);

  const doImport = () => {
    const built = rows.map((r) => {
      const cName = col(map.customerName) != null ? parseExcelValue(r[col(map.customerName)]) : "";
      if (!cName) return null;
      const qty = col(map.qty) != null ? parseExcelQty(r[col(map.qty)]) : 0;
      if (qty <= 0) return null;
      let serviceId = map.serviceMode === "fixed" ? map.fixedService : matchService(services, r[col(map.serviceCol)]);
      if (!serviceId) serviceId = services[0]?.id;
      const priceRaw = col(map.price) != null ? parseExcelPrice(r[col(map.price)]) : null;
      const price = priceRaw != null ? priceRaw : calcPrice(services, serviceId, qty);
      const phone = col(map.phone) != null ? parseExcelValue(r[col(map.phone)]) : "";
      const note = col(map.note) != null ? parseExcelValue(r[col(map.note)]) : "";
      const statusRaw = col(map.status) != null ? matchStatus(r[col(map.status)]) : null;
      const dateRaw = col(map.date) != null ? parseExcelDate(r[col(map.date)]) : null;
      return { customerName: cName, phone, serviceId, qty, price, note, status: statusRaw || "tiepnhan", createdAt: dateRaw || Date.now() };
    }).filter(Boolean);
    onImport(built);
  };

  return (
    <Modal title="Nhập đơn từ Excel" onClose={onClose}>
      {stage === "upload" && (
        <div>
          <div style={{ fontSize: 13, color: "var(--h8B7E6A)", marginBottom: 12, lineHeight: 1.6 }}>
            Chọn file Excel (.xlsx, .xls) hoặc CSV. Dòng đầu tiên là tên cột (VD: Tên khách, SĐT, Dịch vụ, Số kg, Ghi chú…). Sau khi tải lên, anh sẽ chọn cột nào ứng với trường nào — file không cần đúng thứ tự hay đúng tên cột.
          </div>
          <label style={st.uploadBox}>
            📄 Chọn file Excel
            <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} style={{ display: "none" }} />
          </label>
          {error && <div style={{ color: "var(--hC0392B)", fontSize: 13, marginTop: 10 }}>{error}</div>}
        </div>
      )}

      {stage === "map" && (
        <div>
          <div style={{ fontSize: 12, color: "var(--hA89F91)", marginBottom: 10 }}>📄 {fileName} · {rows.length} dòng dữ liệu</div>

          <MapField label="Tên khách *" value={map.customerName} headers={headers} onChange={(v) => setMap({ ...map, customerName: v })} />
          <MapField label="Số điện thoại" value={map.phone} headers={headers} onChange={(v) => setMap({ ...map, phone: v })} />

          <div style={st.label}>Dịch vụ *</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button style={{ ...st.chip, flex: 1, background: map.serviceMode === "column" ? "var(--h6B9B5E)" : "var(--hFFF)", color: map.serviceMode === "column" ? "var(--hFFF)" : "var(--h4A3B2A)", borderColor: "var(--hE5DCC9)" }}
              onClick={() => setMap({ ...map, serviceMode: "column" })}>Từ cột Excel</button>
            <button style={{ ...st.chip, flex: 1, background: map.serviceMode === "fixed" ? "var(--h6B9B5E)" : "var(--hFFF)", color: map.serviceMode === "fixed" ? "var(--hFFF)" : "var(--h4A3B2A)", borderColor: "var(--hE5DCC9)" }}
              onClick={() => setMap({ ...map, serviceMode: "fixed" })}>Cố định 1 loại</button>
          </div>
          {map.serviceMode === "column" ? (
            <>
              <MapField label="" value={map.serviceCol} headers={headers} onChange={(v) => setMap({ ...map, serviceCol: v })} />
              {unmatchedCount > 0 && col(map.serviceCol) != null && (
                <div style={{ fontSize: 12, color: "var(--hD68C45)", marginTop: -6, marginBottom: 8 }}>
                  ⚠️ {unmatchedCount} dòng không nhận diện được tên dịch vụ, sẽ mặc định là "{services[0]?.label}".
                </div>
              )}
            </>
          ) : (
            <select style={{ ...st.input, marginBottom: 10 }} value={map.fixedService} onChange={(e) => setMap({ ...map, fixedService: e.target.value })}>
              {services.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
          )}

          <MapField label="Số lượng (kg / cái) *" value={map.qty} headers={headers} onChange={(v) => setMap({ ...map, qty: v })} />
          <MapField label="Đơn giá (bỏ trống để tự tính)" value={map.price} headers={headers} onChange={(v) => setMap({ ...map, price: v })} />
          <MapField label="Ghi chú" value={map.note} headers={headers} onChange={(v) => setMap({ ...map, note: v })} />
          <MapField label="Trạng thái (bỏ trống = Tiếp nhận)" value={map.status} headers={headers} onChange={(v) => setMap({ ...map, status: v })} />
          <MapField label="Ngày tạo (bỏ trống = hôm nay)" value={map.date} headers={headers} onChange={(v) => setMap({ ...map, date: v })} />

          {preview.length > 0 && (
            <>
              <div style={{ ...st.label, marginTop: 14 }}>Xem trước ({Math.min(5, rows.length)}/{rows.length} dòng)</div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ color: "var(--h8B7E6A)", textAlign: "left" }}>
                      <th style={st.th}>Khách</th><th style={st.th}>DV</th><th style={st.th}>SL</th><th style={st.th}>Giá</th>
                    </tr>
                  </thead>
                  <tbody>
                    {preview.map((p, i) => (
                      <tr key={i} style={{ borderTop: "1px solid var(--hEDE4D3)" }}>
                        <td style={st.td}>{p.cName || "—"}</td>
                        <td style={st.td}>{serviceOf(services, p.serviceId).label.replace("Giặt sấy ", "").replace("Giặt ", "")}</td>
                        <td style={st.td}>{p.qty}</td>
                        <td style={st.td}>{fmtMoney(p.price)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}

          <button style={{ ...st.primaryBtn, opacity: valid ? 1 : 0.4 }} disabled={!valid} onClick={doImport}>
            Import {rows.length} đơn
          </button>
          <button style={{ ...st.linkBtn, display: "block", textAlign: "center", width: "100%", marginTop: 10 }} onClick={() => setStage("upload")}>
            ← Chọn file khác
          </button>
        </div>
      )}
    </Modal>
  );
}

function MapField({ label, value, headers, onChange }) {
  return (
    <div style={{ marginBottom: 8 }}>
      {label && <div style={st.label}>{label}</div>}
      <select style={st.input} value={value} onChange={(e) => onChange(e.target.value)}>
        <option value="">-- Không dùng --</option>
        {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
      </select>
    </div>
  );
}

      {onPrint && (
      <button style={{ ...st.primaryBtn, background: "var(--h6B9B5E)" }} onClick={onPrint}>
          🧾 In bill
        </button>

      {onScanned && (
        <>
          <input ref={scanRef} type="file" accept="image/*" onChange={onScanFile} style={{ display: "none" }} />
          <button
            type="button"
            disabled={scanState === "busy"}
            onClick={() => scanRef.current && scanRef.current.click()}
            style={{ ...st.primaryBtn, background: "var(--hFBEEDF)", color: "var(--h8A5A1C)", border: "2px dashed var(--hD68C45)", opacity: scanState === "busy" ? 0.7 : 1 }}
          >
            {scanState === "busy" ? "⏳ Đang đọc bill… (vài giây)" : "📷 Quét bill tính tiền (POS365)"}
          </button>
          {scanState && scanState.error && (
            <div style={{ fontSize: 12.5, background: "var(--hFDEDE9)", color: "var(--hC0392B)", padding: 10, borderRadius: 10, marginTop: 8, fontWeight: 700 }}>
              ⚠️ {scanState.error}
            </div>
          )}
        </>
      )}
      <button style={{ ...st.primaryBtn, background: "var(--h4A90C2)" }} onClick={onEdit}>
        ✏️ Sửa đơn hàng
      </button>

      {canDelete && (
        !confirmDel ? (
          <button style={{ ...st.linkBtn, marginTop: 12, color: "var(--hC0392B)" }} onClick={() => setConfirmDel(true)}>
            Xoá đơn này
          </button>
        ) : (
          <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
            <button style={{ ...st.primaryBtn, background: "var(--hC0392B)", flex: 1, marginTop: 0 }} onClick={onDelete}>Xác nhận xoá</button>
            <button style={{ ...st.primaryBtn, background: "var(--hB0A695)", flex: 1, marginTop: 0 }} onClick={() => setConfirmDel(false)}>Huỷ</button>
          </div>
        )
      )}
    </Modal>
  );
}

/* ================= IN BILL (khổ 80mm) =================
   Bill được VẼ THÀNH ẢNH (canvas) rồi đổi sang lệnh ESC/POS dạng ảnh nên chữ tiếng Việt có dấu in đúng trên mọi máy in,
   không phụ thuộc bảng mã của máy in. Lệnh in được ghi lên bảng c3h_print_jobs trên Supabase; chương trình
   c3h-print-agent.js chạy trên máy POS trong tiệm sẽ lấy lệnh và gửi tới IP máy in (cổng 9100).
   Muốn đổi thông tin tiệm / lời dặn trên bill: sửa BILL_SHOP ngay dưới đây. */
const BILL_SHOP = {
  name: "Giặt Sấy Cậu 3 Hoàng",
  addressLines: ["ĐC: 93, Đường số 2, khu CBGV ĐHCT", "P. Tân An, TP. Cần Thơ"],
  phone: "SĐT: 0358.036162",
  notes: [
    "Đồ được giặt bằng máy, nên đồ ra màu, đồ cần giặt riêng quý khách vui lòng báo trước với nhân viên. Tiệm không giải quyết khiếu nại nếu không dặn trước.",
    "Tẩy vết bẩn cứng đầu sẽ phát sinh thêm phụ phí. Quý khách có yêu cầu tẩy vui lòng báo cho nhân viên bên mình để được phục vụ tốt nhất ạ.",
  ],
  thanks: "Xin cám ơn, hẹn gặp lại quý khách!",
};
const BILL_WIDTH_DOTS = 576; // 80mm ở 203dpi. Nếu máy in cắt mất mép bill thì đổi thành 512.
const BILL_FONT = '"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const billNum = (n) => Math.round(n || 0).toLocaleString("en-US");
const billQty = (v) => { const q = parseQty(v); return String(Math.round(q * 100) / 100); };
const billDateStr = (ts) => {
  const d = new Date(ts);
  const p = (x) => String(x).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

// Vẽ bill ra canvas rộng BILL_WIDTH_DOTS. Trả về canvas đã cắt đúng chiều cao.
function renderBillCanvas(order, services, cashier) {
  const W = BILL_WIDTH_DOTS, PAD = 6;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = 3000;
  const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, cv.height);
  g.fillStyle = "#000"; g.textBaseline = "alphabetic";
  let y = 10;
  const font = (px, weight, italic) => { g.font = `${italic ? "italic " : ""}${weight || 500} ${px}px ${BILL_FONT}`; };
  const wrap = (text, maxW) => {
    const words = String(text).split(/\s+/); const lines = []; let cur = "";
    words.forEach((w) => {
      const t = cur ? cur + " " + w : w;
      if (g.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  };
  const center = (text, px, weight, gap) => {
    font(px, weight); const lh = Math.round(px * 1.3);
    wrap(text, W - PAD * 2).forEach((ln) => { y += lh; g.textAlign = "center"; g.fillText(ln, W / 2, y - Math.round(px * 0.25)); });
    y += gap || 0;
  };
  const dashed = (gap) => {
    y += 6; g.save(); g.setLineDash([4, 4]); g.lineWidth = 2; g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke(); g.restore(); y += gap == null ? 8 : gap;
  };
  const solid = () => { g.save(); g.lineWidth = 2; g.beginPath(); g.moveTo(PAD, y); g.lineTo(W - PAD, y); g.stroke(); g.restore(); };
  const kv = (label, value, px) => {   // "Nhãn: giá trị" căn trái, tự xuống dòng
    font(px, 500); const lh = Math.round(px * 1.35);
    const lines = wrap(label + " " + value, W - PAD * 2);
    lines.forEach((ln) => { y += lh; g.textAlign = "left"; g.fillText(ln, PAD, y - Math.round(px * 0.25)); });
  };

  // ---- Đầu bill ----
  center(BILL_SHOP.name, 28, 800, 2);
  BILL_SHOP.addressLines.forEach((l) => center(l, 22, 700, 0));
  center(BILL_SHOP.phone, 24, 800, 4);
  dashed(10);
  center("HOÁ ĐƠN BÁN HÀNG", 30, 800, 2);
  center("Số : " + order.code, 28, 800, 8);
  kv("Thời gian nhận:", billDateStr(order.createdAt), 23);
  kv("Khách hàng:", order.customerName || "", 23);
  if (order.phone) kv("SĐT:", order.phone, 23);
  kv("Thu ngân:", cashier || order.createdBy || "", 23);
  y += 8;

  // ---- Bảng hàng ----
  const xTT = W - PAD, xSL = W - PAD - 100, xGia = W - PAD - 180;   // mép phải của từng cột
  const nameW = xGia - 100 - PAD;     // chừa chỗ cho cột đơn giá
  solid(); y += 4;
  font(22, 800); y += 26;
  g.textAlign = "left"; g.fillText("Tên hàng", PAD, y - 5);
  g.textAlign = "right"; g.fillText("Đ.giá", xGia, y - 5); g.fillText("SL", xSL, y - 5); g.fillText("TT", xTT, y - 5);
  y += 6; solid(); y += 4;
  order.items.forEach((it) => {
    const svc = serviceOf(services, it.service);
    let unitPrice = svc.unitPrice || 0, qtyTxt = billQty(it.qty), name = svc.label;
    const q = parseQty(it.qty);
    if (svc.minQty > 0 && q < svc.minQty) {          // dưới ngưỡng: tính 1 lần theo giá tối thiểu
      unitPrice = svc.minPrice || it.price; qtyTxt = "1"; name = `${svc.label} (${billQty(it.qty)} ${svc.unit || "kg"})`;
    } else if (q > 0 && Math.abs(unitPrice * q - it.price) > 1) {   // giá đã bị chỉnh tay: quy đổi để cột vẫn khớp
      unitPrice = Math.round(it.price / q);
    }
    font(22, 500);
    const nameLines = wrap(name, nameW);
    const lh = 29;
    nameLines.forEach((ln, i) => {
      y += lh; g.textAlign = "left"; g.fillText(ln, PAD, y - 6);
      if (i === 0) { g.textAlign = "right"; g.fillText(billNum(unitPrice), xGia, y - 6); g.fillText(qtyTxt, xSL, y - 6); g.fillText(billNum(it.price), xTT, y - 6); }
    });
    y += 2;
  });
  y += 2; solid(); y += 4;

  // ---- Tổng ----
  const subtotal = order.subtotal != null ? order.subtotal : (order.total || 0) - (order.tax || 0);
  const row = (label, val, px, weight) => { font(px, weight); y += Math.round(px * 1.4); g.textAlign = "left"; g.fillText(label, PAD, y - 6); g.textAlign = "right"; g.fillText(val, xTT, y - 6); };
  row("Tổng thành tiền", billNum(subtotal), 24, 800);
  if (order.tax > 0) row(`VAT (${Math.round(TAX_RATE * 100)}%)`, billNum(order.tax), 24, 800);
  row("Tổng cộng", billNum(order.total), 28, 800);
  y += 4; dashed(6);

  // ---- Lời dặn + cảm ơn ----
  BILL_SHOP.notes.forEach((n) => {
    font(20, 500, true); const lh = 27;
    wrap(n, W - PAD * 2).forEach((ln) => { y += lh; g.textAlign = "left"; g.fillText(ln, PAD, y - 6); });
    y += 4;
  });
  dashed(8);
  center(BILL_SHOP.thanks, 24, 800, 10);

  const out = document.createElement("canvas");
  out.width = W; out.height = y + 12;
  const og = out.getContext("2d");
  og.fillStyle = "#fff"; og.fillRect(0, 0, W, out.height);
  og.drawImage(cv, 0, 0);
  return out;
}

// Đổi canvas sang chuỗi lệnh ESC/POS (ảnh đen-trắng, GS v 0) + cho giấy ra + cắt. Trả về chuỗi base64.
function canvasToEscPosBase64(canvas) {
  const w = canvas.width, h = canvas.height, bytesPerRow = Math.ceil(w / 8);
  const px = canvas.getContext("2d").getImageData(0, 0, w, h).data;
  const parts = [];
  parts.push(Uint8Array.from([0x1b, 0x40]));                           // ESC @ : khởi tạo
  const STRIP = 128;                                                   // chia thành từng dải để máy in nhỏ bộ nhớ cũng nuốt được
  for (let y0 = 0; y0 < h; y0 += STRIP) {
    const rows = Math.min(STRIP, h - y0);
    const buf = new Uint8Array(8 + rows * bytesPerRow);
    buf.set([0x1d, 0x76, 0x30, 0x00, bytesPerRow & 255, bytesPerRow >> 8, rows & 255, rows >> 8], 0);
    for (let r = 0; r < rows; r++) {
      for (let x = 0; x < w; x++) {
        const i = ((y0 + r) * w + x) * 4;
        const gray = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
        if (gray < 150) buf[8 + r * bytesPerRow + (x >> 3)] |= 0x80 >> (x & 7);
      }
    }
    parts.push(buf);
  }
  parts.push(Uint8Array.from([0x1b, 0x64, 0x05, 0x1d, 0x56, 0x42, 0x00])); // ESC d 5 (cho giấy ra) + GS V 66 0 (cắt)
  let total = 0; parts.forEach((p) => (total += p.length));
  const all = new Uint8Array(total); let o = 0; parts.forEach((p) => { all.set(p, o); o += p.length; });
  let bin = ""; for (let i = 0; i < all.length; i += 0x8000) bin += String.fromCharCode.apply(null, all.subarray(i, i + 0x8000));
  return btoa(bin);
}

// Gửi lệnh in lên Supabase rồi theo dõi máy POS đã in chưa
async function enqueueBillPrint(order, canvas, cashier) {
  const payload = canvasToEscPosBase64(canvas);
  const res = await sbFetch("c3h_print_jobs", {
    method: "POST",
    headers: { "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify([{ order_code: order.code, payload, created_by: cashier || null }]),
  });
  await sbCheck(res, "gửi lệnh in");
  const rows = await res.json();
  return rows && rows[0] ? rows[0].id : null;
}
async function getPrintJobStatus(id) {
  const res = await sbFetch(`c3h_print_jobs?id=eq.${encodeURIComponent(id)}&select=status,error,attempts`);
  await sbCheck(res, "đọc trạng thái in");
  const rows = await res.json();
  return rows[0] || null;
}

function BillPreviewModal({ order, services, cashier, onClose }) {
  const [imgUrl, setImgUrl] = useState("");
  const [canvas, setCanvas] = useState(null);
  const [state, setState] = useState({ phase: "idle", msg: "" }); // idle | sending | waiting | done | error
  const canPrint = typeof sbFetch !== "undefined" && typeof C3H_AUTH !== "undefined";
  const alive = React.useRef(true);
  useEffect(() => () => { alive.current = false; }, []);
  useEffect(() => {
    try {
      const c = renderBillCanvas(order, services, cashier);
      setCanvas(c); setImgUrl(c.toDataURL("image/png"));
    } catch (e) { setState({ phase: "error", msg: "Không vẽ được bill: " + (e && e.message ? e.message : e) }); }
  }, [order.id]);

  const doPrint = async () => {
    if (!canvas) return;
    setState({ phase: "sending", msg: "Đang gửi lệnh in…" });
    try {
      const id = await enqueueBillPrint(order, canvas, cashier);
      if (!alive.current) return;
      setState({ phase: "waiting", msg: "Đã gửi lệnh, đang chờ máy POS in…" });
      const t0 = Date.now();
      while (alive.current && Date.now() - t0 < 45000) {
        await new Promise((r) => setTimeout(r, 1500));
        if (!alive.current) return;
        const j = id != null ? await getPrintJobStatus(id) : null;
        if (j && j.status === "done") { setState({ phase: "done", msg: "✅ Đã in xong" }); return; }
        if (j && j.status === "error") { setState({ phase: "error", msg: "⚠️ Máy POS không in được: " + (j.error || "lỗi không rõ") }); return; }
      }
      if (alive.current) setState({ phase: "error", msg: "⚠️ Máy POS chưa nhận lệnh. Kiểm tra máy POS đang bật và chương trình in đang chạy rồi bấm In lại." });
    } catch (e) {
      if (alive.current) setState({ phase: "error", msg: "⚠️ " + (e && e.message ? e.message : String(e)) });
    }
  };
  const busy = state.phase === "sending" || state.phase === "waiting";
  const color = state.phase === "done" ? "var(--h5C8A4E)" : state.phase === "error" ? "var(--hC0392B)" : "var(--h8B7E6A)";
  return (
    <Modal title={`Bill ${order.code}`} onClose={onClose}>
      <div style={{ background: "#fff", border: "1px solid var(--hE5DCC9)", borderRadius: 10, padding: 8, maxWidth: 330, margin: "0 auto" }}>
        {imgUrl ? <img src={imgUrl} alt="Xem trước bill" style={{ width: "100%", display: "block" }} /> : <div style={st.empty}>Đang vẽ bill…</div>}
      </div>
      {state.msg && <div style={{ fontSize: 13, fontWeight: 700, color, marginTop: 10, textAlign: "center" }}>{state.msg}</div>}
      {canPrint ? (
        <button style={{ ...st.primaryBtn, background: "var(--h6B9B5E)", opacity: busy || !canvas ? 0.6 : 1 }} disabled={busy || !canvas} onClick={doPrint}>
          {busy ? "Đang in…" : state.phase === "done" ? "🖨 In lại" : "🖨 In bill"}
        </button>
      ) : (
        <div style={{ fontSize: 12, color: "var(--hA89F91)", textAlign: "center", marginTop: 10 }}>
          Chỉ xem trước. Nút in hoạt động ở bản chạy trên GitHub (đã nối Supabase).
        </div>
      )}
    </Modal>
  );
}

}

/* ---- Chỉ số điện / nước / hóa chất ---- */
function MeterTab({ meterLogs, onAdd, onDelete }) {
  const withUsage = useMemo(() => computeMeterUsage(meterLogs), [meterLogs]);
  const now = Date.now();
  const d = new Date();
  const monthStart = new Date(d.getFullYear(), d.getMonth(), 1).getTime();

  const sumUsage = (field, sinceTs) => withUsage.filter((l) => l.createdAt >= sinceTs).reduce((s, l) => s + (l[field] || 0), 0);
  const dienMonth = sumUsage("dienUsed", monthStart);
  const nuocMonth = sumUsage("nuocUsed", monthStart);
  const botGiatMonth = meterLogs.filter((l) => l.createdAt >= monthStart).reduce((s, l) => s + (l.botGiat || 0), 0);
  const nuocXaMonth = meterLogs.filter((l) => l.createdAt >= monthStart).reduce((s, l) => s + (l.nuocXa || 0), 0);

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const day = new Date(); day.setDate(day.getDate() - i);
    const entry = withUsage.find((l) => sameDay(l.createdAt, day.getTime()));
    days.push({ label: day.getDate() + "/" + (day.getMonth() + 1), val: entry?.dienUsed > 0 ? entry.dienUsed : 0 });
  }
  const maxDay = Math.max(...days.map((x) => x.val), 1);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
        <StatCard label="Điện tháng này" value={dienMonth ? dienMonth.toLocaleString("vi-VN") + " kWh" : "—"} sub="theo chỉ số công tơ" accent="var(--h4A90C2)" />
        <StatCard label="Nước tháng này" value={nuocMonth ? nuocMonth.toLocaleString("vi-VN") + " m³" : "—"} sub="theo đồng hồ nước" accent="var(--h3FA796)" />
        <StatCard label="Bột giặt tháng này" value={botGiatMonth ? botGiatMonth.toLocaleString("vi-VN") + " kg" : "—"} sub="đã sử dụng" accent="var(--hD68C45)" />
        <StatCard label="Nước xả tháng này" value={nuocXaMonth ? nuocXaMonth.toLocaleString("vi-VN") + " lít" : "—"} sub="đã sử dụng" accent="var(--h8A7BC8)" />
      </div>

      <button style={st.primaryBtn} onClick={onAdd}>+ Ghi chỉ số hôm nay</button>

      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ fontWeight: 800, marginBottom: 10 }}>Điện tiêu thụ 7 ngày (kWh)</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 100 }}>
          {days.map((x, i) => (
            <div key={i} style={{ flex: 1, textAlign: "center" }}>
              <div style={{ fontSize: 9, color: "var(--h8B7E6A)", marginBottom: 2 }}>{x.val ? x.val : ""}</div>
              <div style={{
                height: Math.max(4, (x.val / maxDay) * 65),
                background: x.val ? "linear-gradient(180deg,var(--h7EB8DE),var(--h4A90C2))" : "var(--hEDE4D3)",
                borderRadius: 6,
              }} />
              <div style={{ fontSize: 9, color: "var(--hA89F91)", marginTop: 4 }}>{x.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ ...st.label, marginTop: 14 }}>Lịch sử ghi nhận</div>
      {withUsage.length === 0 && <div style={st.empty}>Chưa có ghi nhận nào. Bấm "+ Ghi chỉ số hôm nay" để bắt đầu.</div>}
      {withUsage.map((l) => (
        <div key={l.id} style={st.card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div style={{ fontWeight: 800, fontSize: 13 }}>{fmtDate(l.createdAt).split(" ")[0]}</div>
            {onDelete && <button style={{ ...st.linkBtn, color: "var(--hC0392B)" }} onClick={() => onDelete(l.id)}>Xoá</button>}
          </div>
          <div style={{ fontSize: 12, color: "var(--h4A3B2A)", marginTop: 4, lineHeight: 1.7 }}>
            {l.dienReading != null && (
              <div>⚡ Chỉ số điện: {l.dienReading.toLocaleString("vi-VN")}
                {l.dienUsed != null && (
                  <span style={{ color: l.dienUsed < 0 ? "var(--hC0392B)" : "var(--h8B7E6A)" }}>
                    {" "}({l.dienUsed < 0 ? "⚠️ nhỏ hơn lần trước, kiểm tra lại" : "+" + l.dienUsed + " kWh"})
                  </span>
                )}
              </div>
            )}
            {l.nuocReading != null && (
              <div>💧 Chỉ số nước: {l.nuocReading.toLocaleString("vi-VN")}
                {l.nuocUsed != null && (
                  <span style={{ color: l.nuocUsed < 0 ? "var(--hC0392B)" : "var(--h8B7E6A)" }}>
                    {" "}({l.nuocUsed < 0 ? "⚠️ nhỏ hơn lần trước, kiểm tra lại" : "+" + l.nuocUsed + " m³"})
                  </span>
                )}
              </div>
            )}
            {l.botGiat > 0 && <div>🧴 Bột giặt dùng: {l.botGiat} kg</div>}
            {l.nuocXa > 0 && <div>🧴 Nước xả dùng: {l.nuocXa} lít</div>}
            {l.note && <div style={{ color: "var(--h8B7E6A)", marginTop: 2 }}>📝 {l.note}</div>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---- Ca làm việc / kết ca (mở ca → đóng ca đếm mù → ca sau xác nhận bàn giao) ---- */
function ShiftTab({ shifts, orders, expenses, currentUser, currentShift, pendingConfirmShift, onOpenShift, onCloseShift, onConfirmShift, onDeleteShift }) {
  const [confirmDel, setConfirmDel] = useState(null);
  const [reportingMismatch, setReportingMismatch] = useState(false);
  const [mismatchNote, setMismatchNote] = useState("");

  const history = [...shifts].filter((s) => s.status === "confirmed").sort((a, b) => b.openedAt - a.openedAt);

  return (
    <div>
      {currentShift && (
        <div style={{ background: "var(--hF3F8ED)", border: "1px solid var(--hD9EAC9)", borderRadius: 14, padding: 12, marginBottom: 12 }}>
          <div style={{ fontSize: 12, color: "var(--h5C8A4E)", fontWeight: 700 }}>🟢 Ca đang mở</div>
          <div style={{ fontSize: 13, color: "var(--h4A3B2A)", marginTop: 4 }}>Mở bởi {currentShift.openedByName} · {fmtDate(currentShift.openedAt)}</div>
          <div style={{ fontSize: 13, color: "var(--h4A3B2A)", marginTop: 2 }}>Tiền đầu ca: {fmtMoney(currentShift.openingCash)}</div>
          <button style={{ ...st.primaryBtn, background: "var(--hD68C45)" }} onClick={onCloseShift}>🔒 Đóng ca</button>
        </div>
      )}

      {!currentShift && pendingConfirmShift && (
        <div style={{ background: "var(--hFBEEDF)", border: "1px solid var(--hEFD8B0)", borderRadius: 14, padding: 12, marginBottom: 12 }}>
          <div style={{ fontSize: 12, color: "var(--hB5762A)", fontWeight: 700 }}>⏳ Ca trước đang chờ xác nhận bàn giao</div>
          <div style={{ fontSize: 13, color: "var(--h4A3B2A)", marginTop: 4 }}>
            {pendingConfirmShift.closedByName} bàn giao lúc {fmtDate(pendingConfirmShift.closedAt)}
          </div>
          <div style={{ fontSize: 22, fontWeight: 800, color: "var(--h4A3B2A)", marginTop: 4 }}>{fmtMoney(pendingConfirmShift.countedCash)}</div>
          {pendingConfirmShift.variance !== 0 && (
            <div style={{ fontSize: 12, color: "var(--hC0392B)", marginTop: 2, fontWeight: 700 }}>
              ⚠️ Ca trước lệch so với hệ thống tính: {pendingConfirmShift.variance > 0 ? "dư" : "thiếu"} {fmtMoney(Math.abs(pendingConfirmShift.variance))}
              {pendingConfirmShift.varianceNote ? ` — ${pendingConfirmShift.varianceNote}` : ""}
            </div>
          )}

          {!reportingMismatch ? (
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <button style={{ ...st.primaryBtn, flex: 1, marginTop: 0 }} onClick={() => onConfirmShift(pendingConfirmShift.id, true, "")}>
                ✅ Xác nhận đã nhận đủ
              </button>
              <button style={{ ...st.primaryBtn, background: "var(--hB0A695)", flex: 1, marginTop: 0 }} onClick={() => setReportingMismatch(true)}>
                ⚠️ Báo không khớp
              </button>
            </div>
          ) : (
            <div style={{ marginTop: 10 }}>
              <input style={st.input} value={mismatchNote} onChange={(e) => setMismatchNote(e.target.value)} placeholder="Ghi rõ đếm lại được bao nhiêu, vì sao lệch…" />
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button
                  style={{ ...st.primaryBtn, background: "var(--hC0392B)", flex: 1, marginTop: 0 }}
                  disabled={!mismatchNote.trim()}
                  onClick={() => { onConfirmShift(pendingConfirmShift.id, false, mismatchNote.trim()); setReportingMismatch(false); setMismatchNote(""); }}
                >
                  Gửi báo cáo lệch
                </button>
                <button style={{ ...st.primaryBtn, background: "var(--hB0A695)", flex: 1, marginTop: 0 }} onClick={() => setReportingMismatch(false)}>Huỷ</button>
              </div>
            </div>
          )}
        </div>
      )}

      {!currentShift && !pendingConfirmShift && (
        <button style={st.primaryBtn} onClick={onOpenShift}>+ Mở ca mới</button>
      )}

      <div style={{ ...st.label, marginTop: 14 }}>Lịch sử ca làm việc</div>
      {history.length === 0 && <div style={st.empty}>Chưa có ca nào hoàn tất.</div>}
      {history.map((s) => (
        <div key={s.id} style={st.card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 13 }}>{fmtDate(s.openedAt)} → {s.closedAt ? fmtDate(s.closedAt) : "…"}</div>
              <div style={{ fontSize: 12, color: "var(--h8B7E6A)", marginTop: 2 }}>{s.openedByName} mở · {s.closedByName || "?"} đóng</div>
              <div style={{ fontSize: 12, color: "var(--h8B7E6A)", marginTop: 2 }}>Đầu ca {fmtMoney(s.openingCash)} · Thực đếm {fmtMoney(s.countedCash)}</div>
              {s.confirmedByName && (
                <div style={{ fontSize: 12, color: "var(--h5C8A4E)", marginTop: 2 }}>
                  ✅ {s.confirmedByName} xác nhận nhận ca · {fmtDate(s.confirmedAt)}
                </div>
              )}
              {s.confirmNote && <div style={{ fontSize: 12, color: "var(--hC0392B)", marginTop: 2 }}>⚠️ {s.confirmNote}</div>}
            </div>
            {s.variance != null && s.variance !== 0 ? (
              <div style={{ ...st.badge, color: "var(--hC0392B)", background: "var(--hFDEDE9)" }}>
                {s.variance > 0 ? "Dư" : "Thiếu"} {fmtMoney(Math.abs(s.variance))}
              </div>
            ) : (
              <div style={{ ...st.badge, color: "var(--h5C8A4E)", background: "var(--hF3F8ED)" }}>Khớp quỹ</div>
            )}
          </div>
          {s.varianceNote && <div style={{ fontSize: 12, color: "var(--hD68C45)", marginTop: 6 }}>📝 {s.varianceNote}</div>}
          {onDeleteShift && (
            confirmDel === s.id ? (
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button style={{ ...st.primaryBtn, background: "var(--hC0392B)", flex: 1, marginTop: 0, padding: "8px 0", fontSize: 13 }} onClick={() => { onDeleteShift(s.id); setConfirmDel(null); }}>Xác nhận xoá</button>
                <button style={{ ...st.primaryBtn, background: "var(--hB0A695)", flex: 1, marginTop: 0, padding: "8px 0", fontSize: 13 }} onClick={() => setConfirmDel(null)}>Huỷ</button>
              </div>
            ) : (
              <button style={{ ...st.linkBtn, marginTop: 8, color: "var(--hC0392B)" }} onClick={() => setConfirmDel(s.id)}>Xoá</button>
            )
          )}
        </div>
      ))}
    </div>
  );
}

function OpenShiftModal({ suggested, onClose, onSave }) {
  const [openingCash, setOpeningCash] = useState(suggested != null ? String(suggested) : "");
  return (
    <Modal title="Mở ca mới" onClose={onClose}>
      <label style={st.label}>Tiền mặt đầu ca (đếm trong két lúc bắt đầu) *</label>
      <input style={st.input} value={openingCash} onChange={(e) => setOpeningCash(e.target.value.replace(/\D/g, ""))} inputMode="numeric" placeholder="VD: 500000" />
      {suggested != null && (
        <div style={{ fontSize: 11, color: "var(--hA89F91)", marginTop: 4 }}>
          Gợi ý bằng số tiền ca gần nhất đã bàn giao ({fmtMoney(suggested)}) — nhớ đếm lại thực tế, sửa số nếu khác.
        </div>
      )}
      <button
        style={{ ...st.primaryBtn, opacity: openingCash !== "" ? 1 : 0.4 }}
        disabled={openingCash === ""}
        onClick={() => onSave(parseFloat(openingCash) || 0)}
      >
        Mở ca
      </button>
    </Modal>
  );
}

function CloseShiftModal({ shift, onClose, onSave }) {
  const [countedCash, setCountedCash] = useState("");
  const [note, setNote] = useState("");

  return (
    <Modal title={"Đóng ca — mở lúc " + fmtDate(shift.openedAt)} onClose={onClose}>
      <div style={{ fontSize: 12, color: "var(--h8B7E6A)", marginBottom: 8 }}>
        Đếm tiền mặt thực tế trong két rồi nhập vào đây — hệ thống sẽ so sánh với số liệu ghi nhận SAU khi a lưu, để đảm bảo khách quan.
      </div>
      <label style={st.label}>Số tiền đếm được trong két *</label>
      <input style={st.input} value={countedCash} onChange={(e) => setCountedCash(e.target.value.replace(/\D/g, ""))} inputMode="numeric" placeholder="VD: 1250000" />

      <label style={st.label}>Ghi chú (nếu có)</label>
      <input style={st.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="VD: khách trả thiếu 5k chưa xử lý…" />

      <button
        style={{ ...st.primaryBtn, opacity: countedCash !== "" ? 1 : 0.4 }}
        disabled={countedCash === ""}
        onClick={() => onSave(parseFloat(countedCash) || 0, note.trim())}
      >
        Lưu và đóng ca
      </button>
    </Modal>
  );
}

/* ================= REPORT TAB ================= */
function ReportTab({ orders, expenses, services, categories, customers, onOpenOrder }) {
  const now = Date.now();
  const paid = orders.filter((o) => o.status === "hoanthanh" && o.paidAt);

  const todayRev = paid.filter((o) => sameDay(o.paidAt, now)).reduce((s, o) => s + o.total, 0);
  const todayCount = paid.filter((o) => sameDay(o.paidAt, now)).length;

  const week = paid.filter((o) => now - o.paidAt < 7 * 86400000);
  const weekRev = week.reduce((s, o) => s + o.total, 0);

  const d = new Date();
  const monthStart = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  const month = paid.filter((o) => o.paidAt >= monthStart);
  const monthRev = month.reduce((s, o) => s + o.total, 0);

  const pending = orders.filter((o) => o.status !== "hoanthanh");
  const pendingValue = pending.reduce((s, o) => s + o.total, 0);

  // chi phí
  const monthExpList = expenses.filter((e) => e.createdAt >= monthStart);
  const monthExp = monthExpList.reduce((s, e) => s + e.amount, 0);
  const profitMonth = monthRev - monthExp;

  // revenue by service (this month)
  const byService = {};
  month.forEach((o) => o.items.forEach((it) => {
    byService[it.service] = (byService[it.service] || 0) + it.price;
  }));
  const svcRows = Object.entries(byService).sort((a, b) => b[1] - a[1]);
  const maxSvc = svcRows.length ? svcRows[0][1] : 1;

  // expense by category (this month)
  const byCat = {};
  monthExpList.forEach((e) => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = catRows.length ? catRows[0][1] : 1;

  // last 7 days mini chart
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const day = new Date(); day.setDate(day.getDate() - i);
    const rev = paid.filter((o) => sameDay(o.paidAt, day.getTime())).reduce((s, o) => s + o.total, 0);
    days.push({ label: day.getDate() + "/" + (day.getMonth() + 1), rev });
  }
  const maxDay = Math.max(...days.map((x) => x.rev), 1);

  // ---- Công nợ khách hàng: bill "nợ" = đã giao (dagiao) nhưng chưa chuyển "hoàn thành" ----
  const debtOrders = orders.filter((o) => o.status === "dagiao");
  const totalDebt = debtOrders.reduce((s, o) => s + o.total, 0);
  const debtByCustomer = useMemo(() => {
    const map = {};
    debtOrders.forEach((o) => {
      const key = o.phone || o.customerName.toLowerCase();
      if (!map[key]) map[key] = { key, name: o.customerName, phone: o.phone, bills: [], total: 0 };
      map[key].bills.push(o);
      map[key].total += o.total;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [orders]);

  // ---- Tần suất khách quay lại: khoảng cách (ngày) giữa các lần TẠO đơn của cùng khách ----
  const visitStats = useMemo(() => {
    const byCustomer = {};
    orders.forEach((o) => {
      const key = o.phone || o.customerName.toLowerCase();
      if (!byCustomer[key]) byCustomer[key] = { name: o.customerName, phone: o.phone, dates: [] };
      byCustomer[key].dates.push(o.createdAt);
    });
    const rows = [];
    let totalGapDays = 0, gapCount = 0;
    Object.values(byCustomer).forEach((c) => {
      const sorted = [...c.dates].sort((a, b) => a - b);
      const visits = sorted.length;
      let avgGapDays = null;
      if (visits > 1) {
        const gaps = [];
        for (let i = 1; i < sorted.length; i++) gaps.push((sorted[i] - sorted[i - 1]) / 86400000);
        avgGapDays = gaps.reduce((s, g) => s + g, 0) / gaps.length;
        totalGapDays += gaps.reduce((s, g) => s + g, 0);
        gapCount += gaps.length;
      }
      rows.push({ name: c.name, phone: c.phone, visits, lastVisit: sorted[sorted.length - 1], avgGapDays });
    });
    const overallAvgGap = gapCount > 0 ? totalGapDays / gapCount : null;
    // Phân nhóm theo lần ghé gần nhất
    const within7 = rows.filter((r) => now - r.lastVisit <= 7 * 86400000).length;
    const within30 = rows.filter((r) => now - r.lastVisit > 7 * 86400000 && now - r.lastVisit <= 30 * 86400000).length;
    const over30 = rows.filter((r) => now - r.lastVisit > 30 * 86400000).length;
    const repeatCustomers = rows.filter((r) => r.visits > 1).length;
    const oneTimeCustomers = rows.filter((r) => r.visits === 1).length;
    // Khách lâu chưa quay lại nhất, ưu tiên khách đã từng quay lại (visits>1) để nhắc chăm sóc
    const dueForFollowUp = rows
      .filter((r) => r.visits > 1)
      .sort((a, b) => a.lastVisit - b.lastVisit)
      .slice(0, 8);
    return { rows, overallAvgGap, within7, within30, over30, repeatCustomers, oneTimeCustomers, dueForFollowUp };
  }, [orders, now]);

  // ---- Khi nào khách đông: thống kê theo giờ trong ngày / thứ trong tuần / vị trí trong tháng ----
  // Dùng createdAt (lúc khách MANG ĐỒ ĐẾN tạo đơn), không dùng paidAt, để biết lúc nào tiệm đông khách ghé chứ không phải lúc nào thu tiền.
  const timePatterns = useMemo(() => {
    const hourLabels = ["00h", "02h", "04h", "06h", "08h", "10h", "12h", "14h", "16h", "18h", "20h", "22h"];
    const hourEndLabels = ["02h", "04h", "06h", "08h", "10h", "12h", "14h", "16h", "18h", "20h", "22h", "24h"];
    const hourBuckets = hourLabels.map((label, i) => ({ label, endLabel: hourEndLabels[i], count: 0 }));
    const weekdayLabels = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
    const weekdayBuckets = weekdayLabels.map((label) => ({ label, count: 0 }));
    const monthPosLabels = ["Đầu tháng (1–10)", "Giữa tháng (11–20)", "Cuối tháng (21–31)"];
    const monthPosBuckets = monthPosLabels.map((label) => ({ label, count: 0 }));

    orders.forEach((o) => {
      if (!o.createdAt) return;
      const d = new Date(o.createdAt);
      const hourIdx = Math.min(11, Math.floor(d.getHours() / 2));
      hourBuckets[hourIdx].count++;
      const jsDay = d.getDay();
      const weekdayIdx = jsDay === 0 ? 6 : jsDay - 1;
      weekdayBuckets[weekdayIdx].count++;
      const date = d.getDate();
      const monthPosIdx = date <= 10 ? 0 : date <= 20 ? 1 : 2;
      monthPosBuckets[monthPosIdx].count++;
    });

    const maxHour = Math.max(...hourBuckets.map((x) => x.count), 1);
    const maxWeekday = Math.max(...weekdayBuckets.map((x) => x.count), 1);
    const maxMonthPos = Math.max(...monthPosBuckets.map((x) => x.count), 1);

    const totalOrders = orders.length;
    const peakHour = hourBuckets.reduce((best, x) => (x.count > best.count ? x : best), hourBuckets[0]);
    const peakWeekday = weekdayBuckets.reduce((best, x) => (x.count > best.count ? x : best), weekdayBuckets[0]);

    return { hourBuckets, weekdayBuckets, monthPosBuckets, maxHour, maxWeekday, maxMonthPos, totalOrders, peakHour, peakWeekday };
  }, [orders]);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <StatCard label="Doanh thu hôm nay" value={fmtMoney(todayRev)} sub={todayCount + " đơn thanh toán"} accent="var(--h6B9B5E)" />
        <StatCard label="7 ngày qua" value={fmtMoney(weekRev)} sub={week.length + " đơn"} accent="var(--h4A90C2)" />
        <StatCard label="Tháng này" value={fmtMoney(monthRev)} sub={month.length + " đơn"} accent="var(--hD68C45)" />
        <StatCard label="Đơn chưa thu tiền" value={fmtMoney(pendingValue)} sub={pending.length + " đơn đang chạy"} accent="var(--h8A7BC8)" />
      </div>

      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ fontWeight: 800, marginBottom: 10 }}>💰 Lợi nhuận tháng này</div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "4px 0" }}>
          <span style={{ color: "var(--h8B7E6A)" }}>Doanh thu</span>
          <span style={{ fontWeight: 700, color: "var(--h6B9B5E)" }}>{fmtMoney(monthRev)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "4px 0" }}>
          <span style={{ color: "var(--h8B7E6A)" }}>Chi phí</span>
          <span style={{ fontWeight: 700, color: "var(--hC0605A)" }}>-{fmtMoney(monthExp)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "2px solid var(--hEDE4D3)" }}>
          <span style={{ fontWeight: 800 }}>Lợi nhuận</span>
          <span style={{ fontWeight: 800, fontSize: 18, color: profitMonth >= 0 ? "var(--h6B9B5E)" : "var(--hC0392B)" }}>{fmtMoney(profitMonth)}</span>
        </div>
      </div>

      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ fontWeight: 800, marginBottom: 10 }}>Doanh thu 7 ngày (đã thanh toán)</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 110 }}>
          {days.map((x, i) => (
            <div key={i} style={{ flex: 1, textAlign: "center" }}>
              <div style={{ fontSize: 9, color: "var(--h8B7E6A)", marginBottom: 2 }}>{x.rev ? Math.round(x.rev / 1000) + "k" : ""}</div>
              <div style={{
                height: Math.max(4, (x.rev / maxDay) * 70),
                background: x.rev ? "linear-gradient(180deg,var(--h8FBC72),var(--h6B9B5E))" : "var(--hEDE4D3)",
                borderRadius: 6,
              }} />
              <div style={{ fontSize: 9, color: "var(--hA89F91)", marginTop: 4 }}>{x.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ fontWeight: 800, marginBottom: 10 }}>Theo dịch vụ (tháng này)</div>
        {svcRows.length === 0 && <div style={{ fontSize: 13, color: "var(--hA89F91)" }}>Chưa có đơn thanh toán trong tháng.</div>}
        {svcRows.map(([sid, rev]) => (
          <div key={sid} style={{ marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}>
              <span>{serviceOf(services, sid).label}</span>
              <span style={{ fontWeight: 700 }}>{fmtMoney(rev)}</span>
            </div>
            <div style={{ height: 8, background: "var(--hF3ECDD)", borderRadius: 4 }}>
              <div style={{ height: 8, width: (rev / maxSvc) * 100 + "%", background: "var(--h8FBC72)", borderRadius: 4 }} />
            </div>
          </div>
        ))}
      </div>

      {catRows.length > 0 && (
        <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
          <div style={{ fontWeight: 800, marginBottom: 10 }}>Chi phí theo danh mục (tháng này)</div>
          {catRows.map(([cid, amt]) => (
            <div key={cid} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}>
                <span>{expenseCatOf(categories, cid).icon} {expenseCatOf(categories, cid).label}</span>
                <span style={{ fontWeight: 700 }}>{fmtMoney(amt)}</span>
              </div>
              <div style={{ height: 8, background: "var(--hF3ECDD)", borderRadius: 4 }}>
                <div style={{ height: 8, width: (amt / maxCat) * 100 + "%", background: "var(--hE0937A)", borderRadius: 4 }} />
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ================= CÔNG NỢ KHÁCH HÀNG ================= */}
      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <div style={{ fontWeight: 800 }}>🧾 Công nợ khách hàng</div>
          <div style={{ fontWeight: 800, color: totalDebt > 0 ? "var(--hC0392B)" : "var(--h6B9B5E)" }}>{fmtMoney(totalDebt)}</div>
        </div>
        <div style={{ fontSize: 11, color: "var(--hA89F91)", marginBottom: 10 }}>
          Bill được tính là nợ khi đơn đã ở trạng thái "Đã giao" nhưng chưa chuyển sang "Hoàn thành".
        </div>
        {debtByCustomer.length === 0 && (
          <div style={{ fontSize: 13, color: "var(--hA89F91)" }}>Không có khách nào đang nợ 🎉</div>
        )}
        {debtByCustomer.map((c) => (
          <DebtCustomerRow key={c.key} customer={c} onOpenOrder={onOpenOrder} />
        ))}
      </div>

      {/* ================= TẦN SUẤT KHÁCH QUAY LẠI ================= */}
      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ fontWeight: 800, marginBottom: 10 }}>🔁 Khách quay lại (theo ngày tạo đơn)</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <StatCard label="Ghé trong 7 ngày qua" value={visitStats.within7 + " khách"} sub="đơn gần nhất ≤ 7 ngày" accent="var(--h6B9B5E)" />
          <StatCard label="Ghé 8–30 ngày trước" value={visitStats.within30 + " khách"} sub="nên nhắc quay lại" accent="var(--hD68C45)" />
          <StatCard label="Lâu chưa quay lại" value={visitStats.over30 + " khách"} sub="hơn 30 ngày chưa ghé" accent="var(--hC0605A)" />
          <StatCard
            label="Khoảng cách ghé TB"
            value={visitStats.overallAvgGap != null ? Math.round(visitStats.overallAvgGap) + " ngày" : "—"}
            sub={visitStats.repeatCustomers + " khách quay lại · " + visitStats.oneTimeCustomers + " khách mới 1 lần"}
            accent="var(--h4A90C2)"
          />
        </div>

        <div style={{ ...st.label, marginTop: 4 }}>Khách nên nhắc quay lại (lâu chưa ghé nhất, đã từng quay lại trước đó)</div>
        {visitStats.dueForFollowUp.length === 0 && (
          <div style={{ fontSize: 13, color: "var(--hA89F91)" }}>Chưa đủ dữ liệu (cần khách có từ 2 đơn trở lên).</div>
        )}
        {visitStats.dueForFollowUp.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px dashed var(--hEDE4D3)" }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 13 }}>{r.name}</div>
              <div style={{ fontSize: 11, color: "var(--hA89F91)" }}>
                {r.visits} đơn · TB {r.avgGapDays != null ? Math.round(r.avgGapDays) + " ngày/lần" : "—"}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--hC0605A)" }}>{fmtDate(r.lastVisit).split(" ")[0]}</div>
              <div style={{ fontSize: 10, color: "var(--hA89F91)" }}>lần ghé gần nhất</div>
            </div>
          </div>
        ))}
      </div>

      {/* ================= KHI NÀO KHÁCH ĐÔNG ================= */}
      <div style={{ ...st.card, marginTop: 14, cursor: "default" }}>
        <div style={{ fontWeight: 800, marginBottom: 4 }}>🕐 Khi nào khách đông (theo lúc tạo đơn)</div>
        <div style={{ fontSize: 11, color: "var(--hA89F91)", marginBottom: 10 }}>
          Tính theo thời điểm khách mang đồ đến (tạo đơn), không phải lúc thanh toán — để biết khi nào cần thêm người, khi nào vắng.
        </div>

        {timePatterns.totalOrders === 0 && (
          <div style={{ fontSize: 13, color: "var(--hA89F91)" }}>Chưa có đơn nào để thống kê.</div>
        )}

        {timePatterns.totalOrders > 0 && (
          <>
            <div style={{ fontSize: 13, marginBottom: 14, padding: "8px 10px", background: "var(--hFBF4E6)", borderRadius: 10 }}>
              Đông nhất vào khung <b>{timePatterns.peakHour.label}–{timePatterns.peakHour.endLabel}</b>, thứ <b>{timePatterns.peakWeekday.label === "CN" ? "Chủ nhật" : timePatterns.peakWeekday.label.replace("T", "")}</b>.
            </div>

            <div style={{ ...st.label, marginBottom: 6 }}>Theo giờ trong ngày</div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 90, marginBottom: 16 }}>
              {timePatterns.hourBuckets.map((x, i) => (
                <div key={i} style={{ flex: 1, textAlign: "center" }}>
                  <div style={{ fontSize: 8, color: "var(--h8B7E6A)", marginBottom: 2 }}>{x.count || ""}</div>
                  <div style={{
                    height: Math.max(4, (x.count / timePatterns.maxHour) * 56),
                    background: x.count ? "linear-gradient(180deg,var(--h9CC4E8),var(--h4A90C2))" : "var(--hEDE4D3)",
                    borderRadius: 4,
                  }} />
                  <div style={{ fontSize: 8, color: "var(--hA89F91)", marginTop: 3, whiteSpace: "nowrap" }}>{x.label}</div>
                </div>
              ))}
            </div>

            <div style={{ ...st.label, marginBottom: 6 }}>Theo thứ trong tuần</div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 90, marginBottom: 16 }}>
              {timePatterns.weekdayBuckets.map((x, i) => (

/* ================= NHẬP / CẬP NHẬT BẢNG GIÁ ================= */
function ServiceImportModal({ onClose, onImport, services }) {
  const [stage, setStage] = useState("upload");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const [map, setMap] = useState({ label: "", unit: "", price: "", minQty: "", minPrice: "" });

  const col = (idx) => (idx === "" ? null : parseInt(idx, 10));

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setError("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
      if (!raw.length) { setError("File trống, không có dữ liệu."); return; }
      const hdr = raw[0].map((h, i) => (h && String(h).trim()) || `Cột ${i + 1}`);
      const body = raw.slice(1).filter((r) => r.some((c) => String(c).trim() !== ""));
      if (!body.length) { setError("File chỉ có dòng tiêu đề, không có dữ liệu bên dưới."); return; }
      setHeaders(hdr);
      setRows(body);
      setFileName(file.name);
      setStage("map");
    } catch (err) {
      setError("Không đọc được file. Hãy chắc file là .xlsx, .xls hoặc .csv hợp lệ.");
    }
  };

  const built = useMemo(() => {
    if (stage !== "map") return [];
    return rows.map((r) => {
      const label = col(map.label) != null ? parseExcelValue(r[col(map.label)]) : "";
      if (!label) return null;
      const unitRaw = col(map.unit) != null ? parseExcelValue(r[col(map.unit)]) : "";
      const unit = unitRaw || "cái";
      const unitPrice = col(map.price) != null ? (parseExcelPrice(r[col(map.price)]) || 0) : 0;
      const minQty = col(map.minQty) != null ? parseExcelQty(r[col(map.minQty)]) : 0;
      const minPrice = col(map.minPrice) != null ? (parseExcelPrice(r[col(map.minPrice)]) || 0) : 0;
      return { label, unit, unitPrice, minQty, minPrice };
    }).filter(Boolean);
  }, [rows, map, stage]);

  const dupWarnings = useMemo(() => {
    const seen = {};
    const warn = [];
    built.forEach((r) => {
      const key = normalizeStr(r.label) + "|" + normalizeStr(r.unit);
      if (seen[key] && seen[key] !== r.unitPrice) {
        warn.push(`"${r.label}" (${r.unit}) có nhiều giá khác nhau trong file — sẽ lấy giá của dòng cuối cùng (${fmtMoney(r.unitPrice)}).`);
      }
      seen[key] = r.unitPrice;
    });
    return [...new Set(warn)];
  }, [built]);

  const valid = col(map.label) != null && col(map.price) != null;

  return (
    <Modal title="Nhập / cập nhật bảng giá" onClose={onClose}>
      {stage === "upload" && (
        <div>
          <div style={{ fontSize: 13, color: "var(--h8B7E6A)", marginBottom: 12, lineHeight: 1.6 }}>
            Chọn file Excel bảng giá. Dòng đầu là tên cột. Dịch vụ đã có trong danh mục (trùng tên + đơn vị) sẽ được <b>cập nhật giá mới</b>; dịch vụ chưa có sẽ được <b>thêm mới</b> tự động.
          </div>
          <label style={st.uploadBox}>
            📄 Chọn file Excel
            <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} style={{ display: "none" }} />
          </label>
          {error && <div style={{ color: "var(--hC0392B)", fontSize: 13, marginTop: 10 }}>{error}</div>}
        </div>
      )}

      {stage === "map" && (
        <div>
          <div style={{ fontSize: 12, color: "var(--hA89F91)", marginBottom: 10 }}>📄 {fileName} · {rows.length} dòng</div>

          <MapField label="Tên dịch vụ *" value={map.label} headers={headers} onChange={(v) => setMap({ ...map, label: v })} />
          <MapField label="Đơn vị tính (bỏ trống = cái)" value={map.unit} headers={headers} onChange={(v) => setMap({ ...map, unit: v })} />
          <MapField label="Đơn giá *" value={map.price} headers={headers} onChange={(v) => setMap({ ...map, price: v })} />
          <MapField label="Ngưỡng tối thiểu (tuỳ chọn)" value={map.minQty} headers={headers} onChange={(v) => setMap({ ...map, minQty: v })} />
          <MapField label="Giá tối thiểu dưới ngưỡng (tuỳ chọn)" value={map.minPrice} headers={headers} onChange={(v) => setMap({ ...map, minPrice: v })} />

          {dupWarnings.length > 0 && (
            <div style={{ background: "var(--hFDEDE9)", border: "1px solid var(--hF0C4BA)", borderRadius: 12, padding: 10, marginTop: 4, marginBottom: 10 }}>
              {dupWarnings.map((w, i) => <div key={i} style={{ fontSize: 12, color: "var(--hC0605A)", marginBottom: 4 }}>⚠️ {w}</div>)}
            </div>
          )}

          {built.length > 0 && (
            <>
              <div style={{ ...st.label, marginTop: 14 }}>Xem trước ({Math.min(5, built.length)}/{built.length} dòng)</div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ color: "var(--h8B7E6A)", textAlign: "left" }}>
                      <th style={st.th}>Tên</th><th style={st.th}>ĐVT</th><th style={st.th}>Giá</th><th style={st.th}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {built.slice(0, 5).map((r, i) => {
                      const exists = services.some((s) => normalizeStr(s.label) === normalizeStr(r.label) && normalizeStr(s.unit) === normalizeStr(r.unit));
                      return (
                        <tr key={i} style={{ borderTop: "1px solid var(--hEDE4D3)" }}>
                          <td style={st.td}>{r.label}</td>
                          <td style={st.td}>{r.unit}</td>
                          <td style={st.td}>{fmtMoney(r.unitPrice)}</td>
                          <td style={{ ...st.td, color: exists ? "var(--hD68C45)" : "var(--h6B9B5E)", fontWeight: 700 }}>{exists ? "cập nhật" : "mới"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </>
          )}

          <button style={{ ...st.primaryBtn, opacity: valid ? 1 : 0.4 }} disabled={!valid} onClick={() => onImport(built)}>
            Nhập / cập nhật {built.length} dịch vụ
          </button>
          <button style={{ ...st.linkBtn, display: "block", textAlign: "center", width: "100%", marginTop: 10 }} onClick={() => setStage("upload")}>
            ← Chọn file khác
          </button>
        </div>
      )}
    </Modal>
  );
}

function LoginScreen({ users, onLogin, onAuthLogin, loadError }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const handleLogin = async () => {
    setError("");
    const u = username.trim().toLowerCase();
    if (!u || !password) {
      setError("Nhập đủ tên đăng nhập và mật khẩu");
      return;
    }
    setBusy(true);
    try {
      if (hasAuth()) {
        // Supabase Auth: kiểm tra mật khẩu ở máy chủ, nhận về phiên đăng nhập lưu lâu dài
        let sess;
        try {
          sess = await C3H_AUTH.signIn(u, password);
        } catch (e) {
          setError(e && e.message ? e.message : "Đăng nhập thất bại");
          return;
        }
        await onAuthLogin(sess);
        return;
      }
      const account = (users || []).find((x) => x.username.toLowerCase() === u);
      if (!account || account.active === false) {
        setError("Sai tên đăng nhập hoặc mật khẩu");
        return;
      }
      const hash = await hashPassword(password);
      if (hash !== account.passwordHash) {
        setError("Sai tên đăng nhập hoặc mật khẩu");
        return;
      }
      onLogin(account);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ ...st.app, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <style>{css}</style>
      <div style={{ fontSize: 40, marginBottom: 6 }}>🧺</div>
      <div style={{ fontWeight: 800, fontSize: 22, color: "var(--h4A3B2A)", marginBottom: 2 }}>Cậu 3 Hoàng</div>
      <div style={{ fontSize: 13, color: "var(--h8B7E6A)", marginBottom: 24 }}>Đăng nhập để quản lý đơn hàng</div>

      <div style={{ width: "100%", maxWidth: 320 }}>
        <label style={st.label}>Tên đăng nhập</label>
        <input
          style={st.input}
          value={username}
          onChange={(e) => setUsername(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && handleLogin()}
          placeholder="VD: admin"
          autoCapitalize="none"
          autoCorrect="off"
          autoComplete="username"
        />
        <label style={st.label}>Mật khẩu</label>
        <input
          style={st.input}
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && handleLogin()}
          placeholder="••••••••"
          autoComplete="current-password"
        />
        {loadError && (
          <div style={{ fontSize: 12, color: "var(--hC0392B)", background: "var(--hFDEDE9)", borderRadius: 10, padding: "8px 10px", fontWeight: 700, marginTop: 10, lineHeight: 1.4 }}>⚠️ {loadError}</div>
        )}
        {error && (
          <div style={{ fontSize: 12, color: "var(--hC0392B)", fontWeight: 700, marginTop: 6 }}>⚠️ {error}</div>
        )}
        <button style={{ ...st.primaryBtn, opacity: busy ? 0.6 : 1 }} disabled={busy} onClick={handleLogin}>
          {busy ? "Đang kiểm tra…" : "Đăng nhập"}
        </button>
      </div>
      <div style={{ fontSize: 10, color: "var(--hC9BFA8)", marginTop: 30 }}>build {BUILD_TAG}</div>
    </div>
  );
}

/* ================= ĐỔI MẬT KHẨU CỦA MÌNH (Supabase Auth) ================= */
function ChangePasswordModal({ onClose, onSave }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [busy, setBusy] = useState(false);
  const mismatch = pw2 && pw !== pw2;
  const minPw = hasAuth() ? 8 : 6;
  const valid = pw.length >= minPw && pw === pw2;
  const handleSave = async () => {
    setBusy(true);
    try {
      const ok = await onSave(pw);
      if (ok) onClose();
    } finally {
      setBusy(false);
    }
  };
  return (
    <Modal title="🔑 Đổi mật khẩu" onClose={onClose}>
      <label style={st.label}>Mật khẩu mới (tối thiểu {minPw} ký tự)</label>
      <input style={st.input} type="password" value={pw} onChange={(e) => setPw(e.target.value)} autoComplete="new-password" />
      <label style={st.label}>Nhập lại mật khẩu mới</label>
      <input style={st.input} type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} autoComplete="new-password" />
      {mismatch && <div style={{ fontSize: 11, color: "var(--hC0392B)", fontWeight: 700, marginTop: 4 }}>⚠️ Hai lần nhập chưa giống nhau</div>}
      <button style={{ ...st.primaryBtn, opacity: valid && !busy ? 1 : 0.4 }} disabled={!valid || busy} onClick={handleSave}>
        {busy ? "Đang lưu…" : "Đổi mật khẩu"}
      </button>
    </Modal>
  );
}

function UserManagementModal({ users, currentUser, onClose, onSave, onToggleActive, onDelete }) {
  const [editingUser, setEditingUser] = useState(null); // null = danh sách, object = đang thêm/sửa
  const [confirmDelId, setConfirmDelId] = useState(null);

  if (editingUser) {
    return (
      <Modal title={editingUser.id ? "Sửa nhân viên" : "Thêm nhân viên"} onClose={() => setEditingUser(null)}>
        <UserForm
          initial={editingUser}
          existingUsernames={users.filter((u) => u.id !== editingUser.id).map((u) => u.username.toLowerCase())}
          canPickAdmin={currentUser.role === "admin"}
          onCancel={() => setEditingUser(null)}
          onSave={async (u, isNew, pwd) => { const ok = await onSave(u, isNew, pwd); if (ok !== false) setEditingUser(null); }}
        />
      </Modal>
    );
  }

  return (
    <Modal title="Quản lý nhân viên" onClose={onClose}>
      {users.map((u) => (
        <div key={u.id} style={st.card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 14 }}>

                {u.active === false && <span style={{ color: "var(--hC0605A)", fontWeight: 700 }}> · Đã khoá</span>}
              </div>
              <div style={{ fontSize: 12, color: "var(--h8B7E6A)", marginTop: 2 }}>
                @{u.username} · {roleLabel(u.role)}
              </div>
              {hasAuth() && !u.authId && (
                <div style={{ fontSize: 11, color: "var(--hD68C45)", fontWeight: 700, marginTop: 2 }}>Chưa có mật khẩu đăng nhập mới — bấm Sửa để đặt</div>
              )}
            </div>
            {u.role === "admin" && currentUser.role !== "admin" ? (
              <div style={{ fontSize: 11, color: "var(--hA89F91)", fontWeight: 700, textAlign: "right" }}>Chỉ Admin<br />sửa được</div>
            ) : (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
              <button style={st.smallBtn} onClick={() => setEditingUser(u)}>Sửa</button>
              <button style={st.smallBtn} onClick={() => onToggleActive(u.id)}>{u.active === false ? "Mở khoá" : "Khoá"}</button>
              {u.id !== currentUser.id && (
                confirmDelId === u.id ? (
                  <button style={{ ...st.smallBtn, background: "var(--hC0392B)", color: "var(--hFFF)" }} onClick={() => { onDelete(u.id); setConfirmDelId(null); }}>Xác nhận xoá?</button>
                ) : (
                  <button style={{ ...st.smallBtn, color: "var(--hC0392B)" }} onClick={() => setConfirmDelId(u.id)}>Xoá</button>
                )
              )}
            </div>
            )}
          </div>
        </div>
      ))}
      <button style={st.addItemBtn} onClick={() => setEditingUser({ id: null, username: "", fullName: "", role: "thungan" })}>
        + Thêm nhân viên mới
      </button>
    </Modal>
  );
}

function UserForm({ initial, existingUsernames, canPickAdmin, onCancel, onSave }) {
  const isNew = !initial.id;
  const [username, setUsername] = useState(initial.username || "");
  const [fullName, setFullName] = useState(initial.fullName || "");
  const [role, setRole] = useState(initial.role || "thungan");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);

  const authMode = hasAuth();
  const minPw = authMode ? 8 : 4; // mật khẩu đăng nhập thật: tối thiểu 8 ký tự
  const usernameTaken = username.trim() && existingUsernames.includes(username.trim().toLowerCase());
  const usernameOk = !authMode || /^[a-z0-9._-]{2,30}$/.test(username.trim().toLowerCase());
  // Tài khoản cũ chưa có đăng nhập mới (không có authId) bắt buộc đặt mật khẩu khi sửa
  const needPw = isNew || (authMode && !initial.authId);
  const valid = username.trim() && usernameOk && !usernameTaken && fullName.trim() && (needPw ? password.length >= minPw : (!password || password.length >= minPw));

  const handleSave = async () => {
    setBusy(true);
    try {
      await onSave(
        { ...initial, id: initial.id, username: authMode ? username.trim().toLowerCase() : username.trim(), fullName: fullName.trim(), role, passwordHash: initial.passwordHash, active: initial.active !== false },
        isNew,
        password || null
      );
    } finally {
      setBusy(false);
    }
  };

  return (
    <div>
      <label style={st.label}>Tên đăng nhập *</label>
      <input style={st.input} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="VD: thu1" autoCapitalize="none" autoCorrect="off" disabled={authMode && !!initial.authId} />
      {authMode && !usernameOk && username.trim() && <div style={{ fontSize: 11, color: "var(--hC0392B)", fontWeight: 700, marginTop: 4 }}>⚠️ Chỉ dùng chữ không dấu, số, dấu . _ - (2–30 ký tự)</div>}
      {usernameTaken && <div style={{ fontSize: 11, color: "var(--hC0392B)", fontWeight: 700, marginTop: 4 }}>⚠️ Tên đăng nhập đã tồn tại</div>}

      <label style={st.label}>Họ tên</label>
      <input style={st.input} value={fullName} onChange={(e) => setFullName(e.target.value)} placeholder="VD: Nguyễn Thị Thu" />

      <label style={st.label}>Vai trò</label>
      <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
        {ROLES.filter((r) => (r.id !== "admin" || canPickAdmin || role === "admin") && (r.id !== "mayin" || authMode)).map((r) => (
          <button
            key={r.id}
            style={{ ...st.chip, background: role === r.id ? "var(--h6B9B5E)" : "var(--hFFF)", color: role === r.id ? "var(--hFFF)" : "var(--h4A3B2A)", borderColor: role === r.id ? "var(--h6B9B5E)" : "var(--hE5DCC9)" }}
            onClick={() => setRole(r.id)}
          >
            {r.label}
          </button>
        ))}
      </div>
      <div style={{ fontSize: 11, color: "var(--hA89F91)", marginBottom: 8 }}>
        Thu ngân: chỉ tạo/sửa đơn hàng và đổi trạng thái, không xoá đơn, chỉ xem khách hàng. Quản lý/Admin: toàn quyền (chỉ Admin quản lý được tài khoản Admin).{authMode ? " Máy in: chỉ dùng cho máy POS in bill (tài khoản maypos), không đăng nhập app được." : ""}
      </div>

      <label style={st.label}>{needPw ? "Mật khẩu *" : "Đặt lại mật khẩu (để trống nếu không đổi)"}</label>
      <input style={st.input} type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder={"Tối thiểu " + minPw + " ký tự"} autoComplete="new-password" />

      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <button style={{ ...st.primaryBtn, marginTop: 0, flex: 1, opacity: valid && !busy ? 1 : 0.4 }} disabled={!valid || busy} onClick={handleSave}>
          {busy ? "Đang lưu…" : (isNew ? "Thêm nhân viên" : "Lưu thay đổi")}
        </button>
        <button style={{ ...st.primaryBtn, marginTop: 0, flex: 1, background: "var(--hB0A695)" }} onClick={onCancel}>Huỷ</button>
      </div>
    </div>
  );
}
